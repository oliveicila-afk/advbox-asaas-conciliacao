name: Matching de Clientes (01-10 Setembro)

on:
  workflow_dispatch:

jobs:
  matching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests fpdf2

      - name: Run matching script
        env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
          TIMEZONE: America/Manaus
        run: |
          python matching_clientes_01_10_setembro.py 2>&1 | tee matching_output.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matching-results
          path: matching_output.txt
