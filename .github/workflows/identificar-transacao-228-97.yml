name: Identificar transação R$ 228,97 no Advbox

on:
  workflow_dispatch:

jobs:
  find-transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Instalar dependências
        run: pip install requests -q

      - name: Buscar transação de R$ 228,97 no Advbox (setembro 2026)
        env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os
          import requests
          import json

          advbox_token = os.environ.get("ADVBOX_TOKEN", "").strip()

          if not advbox_token:
              print("ERRO: ADVBOX_TOKEN nao configurado!")
              exit(1)

          headers = {
              "Authorization": f"Bearer {advbox_token}",
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "Mozilla/5.0"
          }

          base_url = "https://app.advbox.com.br/api/v1"

          print("Buscando transacoes de setembro 2026 no Advbox...")

          try:
              r = requests.get(
                  f"{base_url}/transactions",
                  headers=headers,
                  timeout=30
              )

              print(f"Status: {r.status_code}")

              if r.status_code != 200:
                  print(f"ERRO na API: {r.status_code}")
                  print(f"Resposta: {r.text[:500]}")
                  exit(1)

              data = r.json()

              # Verificar estrutura
              if isinstance(data, dict):
                  if "results" in data:
                      transactions = data["results"]
                  elif "data" in data:
                      transactions = data["data"]
                  else:
                      transactions = [data]
              elif isinstance(data, list):
                  transactions = data
              else:
                  transactions = []

              print(f"Total de transacoes: {len(transactions)}")

              # Procurar R$ 228,97
              print("\nProcurando transacao com valor R$ 228,97...")
              found_228_97 = []

              for txn in transactions:
                  value = txn.get("value")
                  if value:
                      try:
                          if isinstance(value, str):
                              val_float = float(value.replace(",", "."))
                          else:
                              val_float = float(value)

                          if abs(val_float - 228.97) < 0.01:
                              found_228_97.append(txn)
                      except:
                          pass

              if found_228_97:
                  print(f"\nENTRADA ENCONTRADA: {len(found_228_97)} transacao(oes)")
                  for txn in found_228_97:
                      print(json.dumps(txn, ensure_ascii=False, indent=2))
              else:
                  print("\nNenhuma transacao de R$ 228,97 encontrada")
                  print("\nPrimeiras 5 transacoes:")
                  for i, txn in enumerate(transactions[:5]):
                      print(f"{i+1}. Valor: {txn.get('value')} - {txn.get('description', 'N/A')}")

          except Exception as e:
              print(f"ERRO: {str(e)}")
              exit(1)
          PYTHON_SCRIPT
