name: Investigar antecipacao x recebimento no mesmo dia (somente leitura, sem nomes)
on:
  workflow_dispatch:
    inputs:
      dias: {description: "datas separadas por virgula", required: true, default: "2026-10-13,2026-10-12,2026-09-14"}
permissions:
  contents: write
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
          DIAS: ${{ github.event.inputs.dias }}
        run: |
          python3 - <<'PY'
          import os, re, json, requests
          from collections import defaultdict
          ha={"access_token":os.environ["ASAAS_TOKEN"].strip(),"Accept":"application/json"}
          nr=lambda t:(re.search(r"fatura nr\.\s*(\d+)",str(t.get("description") or "")) or [None,None])[1]
          out={}
          for dia in os.environ["DIAS"].split(","):
              tx=[]; off=0
              while True:
                  j=requests.get("https://api.asaas.com/v3/financialTransactions",headers=ha,params={"startDate":dia,"finishDate":dia,"limit":100,"offset":off},timeout=30).json()
                  tx+=j.get("data",[])
                  if not j.get("hasMore") or not j.get("data"): break
                  off+=100
              tipos=defaultdict(lambda:[0,0.0])
              for t in tx:
                  k=t.get("type")
                  if k in ("PAYMENT_RECEIVED","RECEIVABLE_ANTICIPATION_GROSS_CREDIT","RECEIVABLE_ANTICIPATION_DEBIT","PAYMENT_REVERSAL","PAYMENT_FEE_REVERSAL"):
                      tipos[k][0]+=1; tipos[k][1]=round(tipos[k][1]+float(t["value"]),2)
              deb={}
              for t in tx:
                  if t.get("type")=="RECEIVABLE_ANTICIPATION_DEBIT": deb.setdefault(nr(t),[]).append(round(abs(float(t["value"])),2))
              rec=[t for t in tx if t.get("type")=="PAYMENT_RECEIVED"]
              com_baixa=0; sem_baixa=0; v_sem=0.0; ex=[]
              for t in rec:
                  v=round(float(t["value"]),2); l=deb.get(nr(t),[])
                  if v in l: l.remove(v); com_baixa+=1
                  else:
                      sem_baixa+=1; v_sem=round(v_sem+v,2); ex.append(v)
              out[dia]={"por_tipo":{k:{"qtd":v[0],"soma":v[1]} for k,v in tipos.items()},"recebidos_com_baixa_de_antecipacao":com_baixa,"recebidos_sem_baixa":sem_baixa,"soma_recebidos_sem_baixa":v_sem,"valores_sem_baixa":sorted(ex)}
          json.dump(out,open("investigar_antecipacao.json","w"),indent=1); print(json.dumps(out,indent=1))
          PY
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add investigar_antecipacao.json; git commit -qm "investigar antecipacao" || true; git pull -q --rebase; git push -q
