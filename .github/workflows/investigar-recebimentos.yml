name: Investigar recebimentos sem cliente (descrição, processo, tese) — somente leitura, dados mascarados
on:
  workflow_dispatch:
    inputs:
      dias: {description: "Datas separadas por vírgula", required: true, default: "2026-09-22,2026-09-23,2026-09-30"}
      valores: {description: "Valores separados por vírgula", required: true, default: "6266.59,3675.05,3000.00,8000.00,5245.43"}
permissions:
  contents: write
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          DIAS: ${{ github.event.inputs.dias }}
          VALORES: ${{ github.event.inputs.valores }}
        run: |
          python3 - <<'PY'
          import os, re, time, json, unicodedata, requests
          ha={"access_token":os.environ["ASAAS_TOKEN"].strip(),"Accept":"application/json"}
          hb={"Authorization":f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}","User-Agent":"Mozilla/5.0","Accept":"application/json"}
          A="https://api.asaas.com/v3"; B="https://app.advbox.com.br/api/v1"
          dig=lambda s: re.sub(r"\D","",str(s or ""))
          ini=lambda s: " ".join(p[0] for p in unicodedata.normalize("NFKD",str(s or "")).encode("ascii","ignore").decode().upper().split()) or "-"
          mask=lambda s: re.sub(r"\d","#",str(s or ""))
          alvo={round(float(v),2) for v in os.environ["VALORES"].split(",") if v.strip()}
          lw=[]; off=0
          while True:
              for _ in range(6):
                  r=requests.get(f"{B}/lawsuits",headers=hb,params={"limit":1000,"offset":off},timeout=90)
                  if r.status_code!=429: break
                  time.sleep(30)
              time.sleep(2.2); b=r.json().get("data",[]); lw+=b
              if len(b)<1000: break
              off+=1000
          idx={}
          for l in lw:
              for k in ("process_number","protocol_number"):
                  d=dig(l.get(k))
                  if len(d)==20: idx[d]=l
          out=[]
          for dia in [x.strip() for x in os.environ["DIAS"].split(",") if x.strip()]:
              o=0; txs=[]
              while True:
                  j=requests.get(f"{A}/financialTransactions",headers=ha,params={"startDate":dia,"finishDate":dia,"limit":100,"offset":o},timeout=30).json()
                  txs+=j.get("data",[])
                  if not j.get("hasMore") or not j.get("data"): break
                  o+=100
              for t in txs:
                  if t.get("type")!="PAYMENT_RECEIVED" or not t.get("paymentId"): continue
                  v=round(float(t["value"]),2)
                  if v not in alvo: continue
                  p=requests.get(f"{A}/payments/{t['paymentId']}",headers=ha,timeout=30).json()
                  c=requests.get(f"{A}/customers/{p.get('customer')}",headers=ha,timeout=30).json()
                  txt=f"{p.get('description') or ''} | {p.get('externalReference') or ''}"
                  longas=[dig(x) for x in re.findall(r"\d[\d\-\.\/]{18,}\d",txt)]
                  lei=None
                  for ds in longas:
                      for k in range(0,len(ds)-19):
                          if ds[k:k+20] in idx: lei=idx[ds[k:k+20]]; break
                      if lei: break
                  cli=[ini(x.get("name")) for x in (lei or {}).get("customers",[]) if isinstance(x,dict)]
                  out.append({"dia":dia,"valor":v,"pagador":ini(c.get("name")),"tipo_doc":"CNPJ" if len(dig(c.get("cpfCnpj")))==14 else "CPF",
                              "fatura":p.get("invoiceNumber"),"descricao_mascarada":mask(p.get("description"))[:300],
                              "ext_ref_mascarada":mask(p.get("externalReference")),"billingType":p.get("billingType"),
                              "processo_achado":bool(lei),"lawsuits_id":(lei or {}).get("id"),"tese":(lei or {}).get("type"),"clientes":cli})
          json.dump(out,open("investigar_recebimentos.json","w"),ensure_ascii=False,indent=1,default=str)
          PY
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f investigar_recebimentos.json; git commit -m "investigar recebimentos" || true
          git pull --rebase origin main || true; git push || true
