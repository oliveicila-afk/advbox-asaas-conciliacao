name: Diagnóstico configurações Advbox (categorias, contas, centros)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: GET /settings (1 chamada) - só IDs de categorias, contas e centros de custo
        env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, requests, json
          h = {"Authorization": f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}",
               "User-Agent": "Mozilla/5.0", "Accept": "application/json"}
          r = requests.get("https://app.advbox.com.br/api/v1/settings", headers=h, timeout=30)
          d = r.json() if r.status_code == 200 else {}
          f = d.get("financial", {})
          out = {"status": r.status_code,
                 "categorias": f.get("categories"),
                 "contas": f.get("banks"),
                 "centros_custo": f.get("cost_centers")}
          json.dump(out, open("settings_advbox.json","w"), indent=1, ensure_ascii=False)
          print(r.status_code, len(out["categorias"] or []))
          PY
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f settings_advbox.json
          git commit -m "Settings Advbox (diagnóstico)" || exit 0
          git pull --rebase origin main || true
          git push
