name: Reconciliação Dia a Dia - Receitas

on:
  workflow_dispatch:
    inputs:
      data:
        description: "Data para análise (formato: YYYY-MM-DD, ex: 2026-09-01)"
        required: true
        default: "2026-09-01"

jobs:
  analisar-receitas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Executar análise
        env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          TARGET_DATE: ${{ github.event.inputs.data }}
        run: python3 analise_dia_a_dia.py

      - name: Upload do relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-receitas
          path: relatorio_*.json
          retention-days: 30

      - name: Resultado
        if: success()
        run: |
          echo "✅ Análise de receitas concluída!"
          echo ""
          echo "Próximas ações:"
          echo "1. Revisar o relatório JSON gerado"
          echo "2. Verificar se os totais batem"
          echo "3. Se houver diferença, investigar as transações não correspondentes"
