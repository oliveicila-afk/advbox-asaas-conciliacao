name: Reconciliação Dia a Dia - Receitas

on:
  workflow_dispatch:
    inputs:
      data:
        description: "Data para análise (formato: YYYY-MM-DD, ex: 2026-09-01)"
        required: true
        default: "2026-09-01"

permissions:
  contents: write

jobs:
  analisar-receitas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Executar análise
        env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          TARGET_DATE: ${{ github.event.inputs.data }}
        run: python3 analise_dia_a_dia.py

      - name: Upload do relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-receitas
          path: relatorio_*.json
          retention-days: 30

      - name: Commit relatório
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f relatorio_*.json debug_*.log 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Relatório da reconciliação (${{ github.event.inputs.data }})"
          git pull --rebase origin main 2>/dev/null || true
          git push || echo "Push falhou"

      - name: Resultado
        if: success()
        run: |
          echo "✅ Análise de receitas concluída!"
          cat relatorio_${{ github.event.inputs.data }}.json 2>/dev/null | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          t=d.get('totais_finais',{})
          print(f\"STATUS: {d.get('status')}\")
          print(f\"Asaas: R\${t.get('asaas')} | Advbox: R\${t.get('advbox')} | Diff: R\${t.get('diferenca')}\")
          div=d.get('divergencias',{})
          print(f\"Faltando no Advbox: {len(div.get('faltando_no_advbox',[]))}\")
          print(f\"Fantasmas no Advbox: {len(div.get('fantasmas_no_advbox',[]))}\")
          " 2>/dev/null || true
