name: 🔐 Teste de Formatos de Autenticação Advbox

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar requests
        run: pip install requests

      - name: Testar Múltiplos Formatos de Autenticação
        env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: |
          python3 << 'EOF'
          import os
          import requests
          import json

          token = os.environ.get("ADVBOX_TOKEN", "").strip()

          if not token:
              print("❌ ADVBOX_TOKEN vazio!")
              exit(1)

          print("=" * 90)
          print("TESTE DE MÚLTIPLOS FORMATOS DE AUTENTICAÇÃO - ADVBOX")
          print("=" * 90)
          print(f"\nToken: {token[:20]}...")
          print(f"Comprimento: {len(token)} chars\n")

          # Lista de URLs para testar
          urls = [
              ("app.advbox.com.br/api/v1", "https://app.advbox.com.br/api/v1/transactions"),
              ("api.advbox.com.br/v1", "https://api.advbox.com.br/v1/transactions"),
              ("app.advbox.com/api/v1", "https://app.advbox.com/api/v1/transactions"),
          ]

          # Lista de formatos de header para testar
          auth_formats = [
              ("Bearer (Authorization header)", {"Authorization": f"Bearer {token}", "Accept": "application/json"}),
              ("Token (Authorization header)", {"Authorization": f"Token {token}", "Accept": "application/json"}),
              ("access_token (param)", None),  # Testar como parâmetro
              ("token (custom header)", {"X-API-Key": token, "Accept": "application/json"}),
          ]

          for domain_name, url in urls:
              print(f"\n{'='*90}")
              print(f"🌐 Domínio: {domain_name}")
              print(f"{'='*90}")

              for auth_name, headers in auth_formats:
                  print(f"\n  🔐 Formato: {auth_name}")
                  print(f"     URL: {url}")

                  try:
                      if auth_name == "access_token (param)":
                          params = {"access_token": token}
                          resp = requests.get(url, params=params, timeout=10)
                          print(f"     Parâmetro: ?access_token=...")
                      else:
                          params = {"limit": 1, "offset": 0}
                          resp = requests.get(url, headers=headers, params=params, timeout=10)
                          print(f"     Headers: {list(headers.keys())}")

                      status = resp.status_code
                      status_emoji = "✅" if status == 200 else "❌" if status in [401, 403] else "⚠️"

                      print(f"     {status_emoji} Status: {status}")

                      if status == 200:
                          data = resp.json()
                          print(f"     ✅ SUCESSO! Resposta JSON recebida")
                          print(f"        Chaves: {list(data.keys())[:5]}")
                      else:
                          print(f"        Resposta: {resp.text[:150]}")

                  except Exception as e:
                      print(f"     ❌ ERRO: {type(e).__name__}: {str(e)[:100]}")

          print(f"\n{'='*90}")
          print("FIM DO TESTE")
          print(f"{'='*90}\n")

          EOF
