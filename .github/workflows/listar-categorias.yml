name: List - Categorias do Advbox

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: List Categorias
        env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: |
          echo "ADVBOX_TOKEN length: ${#ADVBOX_TOKEN}"
          python listar_categorias.py
        continue-on-error: false

      - name: Upload output if failed
        if: failure()
        run: |
          echo "Workflow failed - ADVBOX_TOKEN may not be configured"
