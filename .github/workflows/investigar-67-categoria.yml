name: Investigar categoria do lancamento 11524079 pelo historico (sem nomes)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, time, requests
          hb={"Authorization":f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}","User-Agent":"Mozilla/5.0","Accept":"application/json"}
          B="https://app.advbox.com.br/api/v1"
          d=requests.get(f"{B}/transactions/11524079",headers=hb,timeout=60).json(); time.sleep(2.2); d=d.get("data",d)
          lw=d.get("lawsuits_id"); cu=d.get("customers_id")
          out={"lawsuits_id":lw,"customers_id":cu,"due":str(d.get("date_due"))[:10],"valor":d.get("amount"),"cc":d.get("cost_center"),"transacoes_do_processo":[],"tarefas":[],"processos_do_cliente":[]}
          off=0
          while True:
              r=requests.get(f"{B}/transactions",headers=hb,params={"limit":1000,"offset":off},timeout=90); time.sleep(2.2)
              b=r.json().get("data",[])
              for t in b:
                  if lw and t.get("lawsuit_id")==lw: out["transacoes_do_processo"].append({"id":t["id"],"valor":t.get("amount"),"cat":t.get("category"),"due":str(t.get("date_due"))[:10],"pago":str(t.get("date_payment") or "")[:10],"cc":t.get("cost_center")})
              if len(b)<1000: break
              off+=1000
          off=0
          while True:
              r=requests.get(f"{B}/posts",headers=hb,params={"limit":1000,"offset":off},timeout=90); time.sleep(2.2)
              b=r.json().get("data",[])
              for p in b:
                  if lw and str(p.get("lawsuits_id"))==str(lw): out["tarefas"].append({"data":str(p.get("date"))[:10],"tarefa":p.get("task"),"notas":str(p.get("notes") or "")[:300]})
              if len(b)<1000: break
              off+=1000
          if lw:
              l=requests.get(f"{B}/lawsuits/{lw}",headers=hb,timeout=60).json(); out["tese"]=(l.get("data",l).get("type"))
          json.dump(out,open("investigar_67.json","w"),ensure_ascii=False,indent=1); print("ok")
          PY
          openssl cms -encrypt -binary -aes-256-cbc -in investigar_67.json -out investigar_67.enc -outform DER .github/relatorio-publico.pem
          rm investigar_67.json
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add investigar_67.enc; git commit -qm "investigar 67" || true; git pull -q --rebase; git push -q
