name: Inspecionar tipos de transação 13/10
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, requests
          from collections import defaultdict

          ha = {"access_token": os.environ["ASAAS_TOKEN"].strip(), "Accept": "application/json"}
          A = "https://api.asaas.com/v3"

          target_date = "2026-10-13"
          off = 0
          all_txs = []
          while True:
              r = requests.get(f"{A}/financialTransactions",
                               headers=ha,
                               params={"startDate": target_date, "finishDate": target_date, "limit": 100, "offset": off},
                               timeout=30)
              data = r.json().get("data", [])
              all_txs.extend(data)
              if not r.json().get("hasMore") or not data:
                  break
              off += 100

          # Agrupar por tipo
          por_tipo = defaultdict(lambda: {"qtd": 0, "soma": 0, "exemplos": []})

          for t in all_txs:
              tipo = t.get("type")
              valor = float(t.get("value", 0))
              desc = t.get("description", "")[:80]

              por_tipo[tipo]["qtd"] += 1
              por_tipo[tipo]["soma"] += valor
              if len(por_tipo[tipo]["exemplos"]) < 2:
                  por_tipo[tipo]["exemplos"].append({"valor": valor, "desc": desc})

          # Tipos que o código CONTA
          COUNTED = {"PAYMENT_RECEIVED", "RECEIVABLE_ANTICIPATION_GROSS_CREDIT", "PAYMENT_FEE_REVERSAL"}

          resultado = {
              "data": target_date,
              "total_txs": len(all_txs),
              "tipos_identificados": {}
          }

          soma_total = 0
          soma_contada = 0

          for tipo in sorted(por_tipo.keys()):
              info = por_tipo[tipo]
              é_contada = tipo in COUNTED
              soma_total += info["soma"]
              if é_contada:
                  soma_contada += info["soma"]

              resultado["tipos_identificados"][tipo] = {
                  "quantidade": info["qtd"],
                  "soma": round(info["soma"], 2),
                  "é_contada_no_código": é_contada,
                  "exemplo": info["exemplos"][0] if info["exemplos"] else None
              }

          resultado["resumo"] = {
              "soma_total_asaas": round(soma_total, 2),
              "soma_contada_pelo_código": round(soma_contada, 2),
              "diferença": round(soma_total - soma_contada, 2)
          }

          json.dump(resultado, open("inspecionar_tipos_13_10.json", "w"), ensure_ascii=False, indent=2)
          print(json.dumps(resultado, ensure_ascii=False, indent=2))
          PY
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f inspecionar_tipos_13_10.json; git commit -m "inspecionar tipos 13/10" || true
          git pull --rebase origin main || true; git push || true
