name: Ajustar data de pagamento do lançamento 16871791 para 11/09
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, requests
          hb = {"Authorization": f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}", "User-Agent": "Mozilla/5.0", "Accept": "application/json", "Content-Type": "application/json"}
          u="https://app.advbox.com.br/api/v1/transactions/16871791"
          r=requests.put(u,headers=hb,json={"date_payment":"2026-09-11"},timeout=30)
          d=requests.get(u,headers=hb,timeout=30).json()
          out={"http":r.status_code,"date_payment":d.get("date_payment"),"amount":d.get("amount"),"bank":d.get("bank")}
          json.dump(out,open("ajuste_simone_resultado.json","w"));print(out)
          PY
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ajuste_simone_resultado.json; git commit -m "ajuste simone" || true
          git pull --rebase origin main || true; git push || true
