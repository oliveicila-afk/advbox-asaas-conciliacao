name: Debug Account Filter

on:
  workflow_dispatch:
    inputs:
      data:
        description: "Data para teste (formato: YYYY-MM-DD)"
        required: true
        default: "2026-09-01"

jobs:
  debug-filters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Executar debug de filtros
        env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
          TARGET_DATE: ${{ github.event.inputs.data }}
        run: python3 debug_account_filter.py

      - name: Upload do resultado de debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-account-filter-output
          path: debug_account_filter_output.txt
          retention-days: 7
