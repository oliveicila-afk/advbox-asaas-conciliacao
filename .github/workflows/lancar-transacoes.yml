name: Lançar Transações Faltantes em Advbox

on:
  workflow_dispatch:

jobs:
  lancar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests fpdf2

      - name: Run lançamento script (curl version)
        env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
          TIMEZONE: America/Manaus
        run: |
          python lancar_transacoes_v2.py 2>&1 | tee lancamento_output.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lancamento-results
          path: lancamento_output.txt
