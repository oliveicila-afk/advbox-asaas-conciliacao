name: Corrigir lançamento do repasse FIC (categoria êxito-concurso, cliente e processo)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, time, json, unicodedata, requests
          hb={"Authorization":f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}","User-Agent":"Mozilla/5.0","Accept":"application/json","Content-Type":"application/json"}
          B="https://app.advbox.com.br/api/v1"
          ini=lambda s: " ".join(p[0] for p in unicodedata.normalize("NFKD",str(s or "")).encode("ascii","ignore").decode().upper().split())
          st=requests.get(f"{B}/settings",headers=hb,timeout=60).json(); time.sleep(2.2)
          cat=next(c["id"] for c in st["financial"]["categories"] if c["category"]=="HONORÁRIOS CONTRATUAIS DE ÊXITO-CONCURSO")
          lw=None; off=0
          while lw is None:
              r=requests.get(f"{B}/lawsuits",headers=hb,params={"limit":1000,"offset":off},timeout=90); time.sleep(2.2)
              b=r.json().get("data",[])
              lw=next((l for l in b if l.get("id")==5836169),None)
              if len(b)<1000: break
              off+=1000
          cl=[c for c in lw.get("customers",[]) if isinstance(c,dict) and ini(c.get("name"))=="D P D F"]
          out={"categoria_id":cat,"clientes_encontrados":len(cl)}
          if len(cl)==1:
              u=f"{B}/transactions/18015545"
              r=requests.put(u,headers=hb,json={"entry_type":"income","users_id":65747,"debit_account":193264,"categories_id":cat,"cost_centers_id":62649,"customers_id":cl[0]["customer_id"],"lawsuits_id":5836169,"amount":"9351,31","date_due":"2026-09-28","date_payment":"2026-09-28","description":"Repasse Caixa (êxito)"},timeout=30)
              d=requests.get(u,headers=hb,timeout=30).json()
              out.update({"put_http":r.status_code,"put_resp":r.text[:200],"depois":{k:d.get(k) for k in ("category","cost_center","customers_id","lawsuits_id","amount","date_payment")}})
          json.dump(out,open("corrigir_fic_resultado.json","w"),ensure_ascii=False,indent=1,default=str); print(out)
          PY
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f corrigir_fic_resultado.json; git commit -m "corrigir fic" || true
          git pull --rebase origin main || true; git push || true
