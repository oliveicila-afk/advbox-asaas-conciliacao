name: Achar lancamentos de cobrancas estornadas e o de 166,42 (somente leitura, so iniciais)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, re, json, time, unicodedata, datetime as dt, requests
          ha={"access_token":os.environ["ASAAS_TOKEN"].strip(),"Accept":"application/json"}
          hb={"Authorization":f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}","User-Agent":"Mozilla/5.0","Accept":"application/json"}
          A="https://api.asaas.com/v3"; B="https://app.advbox.com.br/api/v1"
          ini=lambda s:" ".join(p[0] for p in unicodedata.normalize("NFKD",str(s or "")).encode("ascii","ignore").decode().upper().split()) or "-"
          out={"estornos_asaas":[],"advbox":[]}
          d=dt.date(2026,9,1)
          while d<=dt.date(2026,10,14):
              off=0
              while True:
                  j=requests.get(f"{A}/financialTransactions",headers=ha,params={"startDate":d.isoformat(),"finishDate":d.isoformat(),"limit":100,"offset":off},timeout=30).json()
                  for t in j.get("data",[]):
                      if t.get("type")=="PAYMENT_REVERSAL":
                          nm=re.sub(r"^.*fatura nr\.\s*\d+\s*","",str(t.get("description")))
                          out["estornos_asaas"].append({"dia":d.isoformat(),"valor":t["value"],"cli":ini(nm)})
                  if not j.get("hasMore") or not j.get("data"): break
                  off+=100
              d+=dt.timedelta(days=1)
          vals={round(abs(e["valor"]),2) for e in out["estornos_asaas"]}|{166.42}
          off=0
          while True:
              r=requests.get(f"{B}/transactions",headers=hb,params={"limit":1000,"offset":off},timeout=90); time.sleep(2.2)
              b=r.json().get("data",[])
              for t in b:
                  try: a=round(float(str(t.get("amount")).replace(",",".")),2)
                  except: continue
                  if t.get("entry_type")=="income" and a in vals and "2026-09-01"<=str(t.get("date_due"))[:10]<="2026-10-31":
                      out["advbox"].append({"id":t["id"],"valor":a,"cli":ini(t.get("name")),"due":str(t.get("date_due"))[:10],"pago":str(t.get("date_payment") or "")[:10],"banco":t.get("debit_bank")})
              if len(b)<1000: break
              off+=1000
          json.dump(out,open("estornados.json","w"),ensure_ascii=False,indent=1); print(out)
          PY
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add estornados.json; git commit -qm "estornados" || true; git pull -q --rebase; git push -q
