name: Lançar TEDs no Advbox

on:
  workflow_dispatch:

jobs:
  lanca_teds:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Lançar TEDs
        run: |
          python scripts/lanca_teds_advbox.py "${{ secrets.ADVBOX_TOKEN }}"
