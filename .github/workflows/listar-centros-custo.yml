name: Listar centros de custo (somente leitura)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, requests
          hb={"Authorization":f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}","User-Agent":"Mozilla/5.0","Accept":"application/json"}
          s=requests.get("https://app.advbox.com.br/api/v1/settings",headers=hb,timeout=60).json()
          s=s.get("data",s)
          cc=[c.get("name") if isinstance(c,dict) else c for c in s["financial"]["cost_centers"]]
          json.dump(sorted(cc),open("centros_custo.json","w"),ensure_ascii=False,indent=1)
          PY
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add centros_custo.json; git commit -qm "centros de custo" || true; git pull -q --rebase; git push -q
