name: Verificar Reconciliação

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Verificar Status da Reconciliação
        env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: |
          mkdir -p output
          python3 -m pip install requests --quiet 2>/dev/null || true
          python3 debug_transacoes.py > output/debug_output.txt 2>&1
          cat output/debug_output.txt

      - name: Gerar Relatório de Verificação
        if: always()
        run: |
          mkdir -p output
          cat > output/verification_report.md << 'REPORT'
          # Relatório de Verificação da Reconciliação

          ## Data da Verificação
          $(date)

          ## Objetivo
          Verificar se os chargebacks foram removidos da conta ASAAS (ID: 193264):
          - 09/04: -R$ 11.133,35 ❓
          - 09/08: -R$ 17.558,66 ❓

          ## Status Esperado
          - **Receitas:** 5 transações = R$ 14.393,44
          - **Chargebacks:** 0 (nenhum)
          - **Saldo Final:** R$ 14.393,44

          ## Próximos Passos
          1. Verificar logs da workflow
          2. Se chargebacks ainda existem: investigar por que a deleção falhou
          3. Se chargebacks foram deletados: reconciliação completa ✅

          REPORT
          cat output/verification_report.md

      - name: Upload Verification Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: output/
          retention-days: 7
