name: Sondar cadastro de pessoas e lançamentos de parceria (somente leitura)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, re, json, time, unicodedata, requests
          hb={"Authorization":f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}","User-Agent":"Mozilla/5.0","Accept":"application/json"}
          B="https://app.advbox.com.br/api/v1"
          out={"pessoas":{}, "parceria":[]}
          SENS=("name","identification","email","phone","cell","address","street","number","complement","district","city","state","zip","birth","cpf","rg","mother","father","motherName")
          for cid in (13732564,13475414,2735052):
              r=requests.get(f"{B}/customers/{cid}",headers=hb,timeout=30); time.sleep(2.2)
              try: j=r.json()
              except Exception: j={}
              d=j.get("data",j) if isinstance(j,dict) else {}
              out["pessoas"][cid]={"http":r.status_code,"chaves":sorted(d.keys()) if isinstance(d,dict) else str(type(d)),
                  "valores":{k:v for k,v in (d.items() if isinstance(d,dict) else []) if not any(s in k.lower() for s in SENS) and not isinstance(v,(list,dict))},
                  "listas":{k:(v if k.lower() in ("tags","origins","groups","custom_fields","customfields","extra","fields") else "<%s>"%type(v).__name__) for k,v in (d.items() if isinstance(d,dict) else []) if isinstance(v,(list,dict))}}
          # lançamentos de parceria (qualquer tipo/mês)
          off=0
          norm=lambda s: unicodedata.normalize("NFKD",str(s or "")).encode("ascii","ignore").decode().upper()
          while True:
              r=requests.get(f"{B}/transactions",headers=hb,params={"limit":1000,"offset":off},timeout=90); time.sleep(2.2)
              b=r.json().get("data",[])
              for t in b:
                  txt=" ".join(norm(t.get(k)) for k in ("category","cost_center","description","name"))
                  if "PARCER" in txt:
                      out["parceria"].append({"id":t["id"],"tipo":t.get("entry_type"),"valor":t.get("amount"),"cat":t.get("category"),"centro":t.get("cost_center"),
                         "pago":str(t.get("date_payment") or "")[:10],"venc":str(t.get("date_due") or "")[:10],"banco":t.get("debit_bank") or t.get("credit_bank"),
                         "tem_cliente":bool(t.get("name")),"proc":t.get("lawsuit_id"),"desc_mascarada":re.sub(r"\d","#",str(t.get("description") or ""))[:80]})
              if len(b)<1000: break
              off+=1000
          out["parceria"]=sorted(out["parceria"],key=lambda x:x["venc"],reverse=True)[:30]
          json.dump(out,open("sonda_pessoas_parceria.json","w"),ensure_ascii=False,indent=1,default=str)
          PY
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f sonda_pessoas_parceria.json; git commit -m "sonda pessoas parceria" || true
          git pull --rebase origin main || true; git push || true
