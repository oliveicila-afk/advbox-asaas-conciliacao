name: Analisar tese pelo tipo de processo (somente leitura, só totais)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Analisar
        env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: python3 analisar_tese_por_processo.py
      - name: Commit (só totais)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f analise_tese_processo.json
          git commit -m "Análise de tese por processo (totais)" || exit 0
          git pull --rebase origin main || true
          git push
