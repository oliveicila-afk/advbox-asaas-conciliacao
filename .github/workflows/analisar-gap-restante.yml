name: Analisar gap restante

on:
  workflow_dispatch:

jobs:
  analisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, requests

          asaas_token = os.environ["ASAAS_TOKEN"].strip()
          ha = {"access_token": asaas_token, "Accept": "application/json"}

          print("=== ANALISANDO GAP DE R$ 354,61 ===\n")
          print("Procurando transações em setembro 2026 com valor próximo a 354,61 ou múltiplos\n")

          all_sep = []
          for dia in range(1, 31):
              d = f"2026-09-{dia:02d}"
              off = 0
              while True:
                  r = requests.get("https://api.asaas.com/v3/financialTransactions",
                                    headers=ha,
                                    params={"startDate": d, "finishDate": d, "limit": 100, "offset": off},
                                    timeout=30)
                  batch = r.json().get("data", [])
                  all_sep.extend(batch)
                  if not r.json().get("hasMore") or not batch:
                      break
                  off += 100

          # Procurar valores próximos a 354.61
          target = 354.61
          tolerance = 1.0
          candidates = [t for t in all_sep if abs(float(t.get("value", 0)) - target) < tolerance]
          
          print(f"Transações com valor próximo a R$ {target}:")
          if candidates:
              for t in candidates:
                  print(f"  {t.get('date', '')}: {t.get('type', '')} - R$ {t.get('value', 0)}")
          else:
              print("  (nenhuma encontrada)")

          # Procurar por descrição contendo "desbloqueio"
          print(f"\nTransações com 'desbloqueio' na descrição:")
          desbloqueios = [t for t in all_sep if "desbloqueio" in str(t.get("description", "")).lower()]
          if desbloqueios:
              for t in desbloqueios:
                  print(f"  {t.get('date', '')}: {t.get('type', '')} - R$ {t.get('value', 0)}")
                  print(f"    Desc: {t.get('description', '')}")
          else:
              print("  (nenhuma encontrada)")

          # Listar todos os tipos de transação
          print(f"\nTipos de transação em setembro:")
          types = {}
          for t in all_sep:
              tt = t.get("type", "UNKNOWN")
              if tt not in types:
                  types[tt] = []
              types[tt].append(float(t.get("value", 0)))

          for tt in sorted(types.keys()):
              values = types[tt]
              print(f"  {tt}: {len(values)} transações, total R$ {sum(values):.2f}")

          # Resumo total
          total_sep = sum(float(t.get("value", 0)) for t in all_sep)
          print(f"\n💰 Total setembro: R$ {total_sep:.2f}")
          print(f"📊 Advbox reportou: R$ 315.228,39")
          print(f"📊 ASAAS reportou: R$ 316.583,00")
          print(f"❓ Gap original: R$ 1.354,61")
          print(f"✅ Postado: R$ 1.000,00")
          print(f"❓ Gap restante: R$ 354,61")
          PY
