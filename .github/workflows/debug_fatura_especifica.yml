name: Debug Fatura Específica

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Debug Fatura Específica
        env:
          ASAAS_CHAVE: ${{ secrets.ASAAS_CHAVE }}
        run: python scripts/debug_fatura_especifica.py
