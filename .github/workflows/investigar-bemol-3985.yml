name: Investigar repasse Bemol de 3.985,60 (somente leitura, sem nomes)
on:
  workflow_dispatch:
    inputs:
      dia: {description: "YYYY-MM-DD", required: true, default: "2026-09-08"}
      valor: {description: "valor", required: true, default: "3985.60"}
permissions:
  contents: write
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          DIA: ${{ github.event.inputs.dia }}
          VALOR: ${{ github.event.inputs.valor }}
        run: |
          python3 - <<'PY'
          import os, re, json, time, unicodedata, requests
          ha={"access_token":os.environ["ASAAS_TOKEN"].strip(),"Accept":"application/json"}
          hb={"Authorization":f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}","User-Agent":"Mozilla/5.0","Accept":"application/json"}
          A="https://api.asaas.com/v3"; B="https://app.advbox.com.br/api/v1"
          ini=lambda s:" ".join(p[0] for p in unicodedata.normalize("NFKD",str(s or "")).encode("ascii","ignore").decode().upper().split()) or "-"
          dig=lambda s: re.sub(r"\D","",str(s or ""))
          v=round(float(os.environ["VALOR"]),2); out=[]
          off=0; txs=[]
          while True:
              j=requests.get(f"{A}/financialTransactions",headers=ha,params={"startDate":os.environ["DIA"],"finishDate":os.environ["DIA"],"limit":100,"offset":off},timeout=30).json()
              txs+=j.get("data",[])
              if not j.get("hasMore") or not j.get("data"): break
              off+=100
          lws=[]; o=0
          while True:
              r=requests.get(f"{B}/lawsuits",headers=hb,params={"limit":1000,"offset":o},timeout=90); time.sleep(2.2)
              b=r.json().get("data",[]); lws+=b
              if len(b)<1000: break
              o+=1000
          idx={}
          for l in lws:
              for k in ("process_number","protocol_number"):
                  d=dig(l.get(k))
                  if len(d)==20: idx[d]=l
          for t in txs:
              if round(float(t.get("value",0)),2)!=v or not t.get("paymentId"): continue
              p=requests.get(f"{A}/payments/{t['paymentId']}",headers=ha,timeout=30).json()
              c=requests.get(f"{A}/customers/{p.get('customer')}",headers=ha,timeout=30).json() if p.get("customer") else {}
              txt=f"{p.get('description') or ''} | {p.get('externalReference') or ''}"
              longas=[dig(x) for x in re.findall(r"\d[\d\-\.\/]{18,}\d",txt)]
              ach=None
              for ds in longas:
                  for i in range(0,len(ds)-19):
                      if ds[i:i+20] in idx: ach=idx[ds[i:i+20]]
              out.append({"tipo":t.get("type"),"pagador":ini(c.get("name")),"tem_numero_longo":bool(longas),"processo_achado":bool(ach),
                          "processo":({"id":ach.get("id"),"tese":(ach.get("type") or {}).get("name") if isinstance(ach.get("type"),dict) else ach.get("type"),"clientes":[ini(x.get("name")) for x in ach.get("customers",[]) if isinstance(x,dict)]} if ach else None),
                          "billing":p.get("billingType"),"tem_descricao":bool(p.get("description")),"desc_tamanho":len(p.get("description") or ""),"ext_ref":bool(p.get("externalReference"))})
          json.dump(out,open("investigar_bemol_3985.json","w"),ensure_ascii=False,indent=1); print(out)
          PY
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f investigar_bemol_3985.json; git commit -m "investigar bemol 3985" || true
          git pull --rebase origin main || true; git push || true
