name: Auditar Advbox — período (somente leitura, sem nomes)

on:
  workflow_dispatch:
    inputs:
      inicio:
        description: "Data inicial YYYY-MM-DD"
        required: true
        default: "2026-09-07"
      fim:
        description: "Data final YYYY-MM-DD"
        required: true
        default: "2026-09-10"

permissions:
  contents: write

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - name: Auditar lançamentos Advbox do período
        env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          INICIO: ${{ github.event.inputs.inicio }}
          FIM: ${{ github.event.inputs.fim }}
        run: |
          python3 - <<'PY'
          import os, time, json, requests
          from collections import defaultdict

          ini, fim = os.environ["INICIO"], os.environ["FIM"]
          h = {"Authorization": f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}",
               "User-Agent": "Mozilla/5.0", "Accept": "application/json"}

          def val(tx):
              return round(float(str(tx.get("value", tx.get("amount", 0))).replace(",", ".")), 2)

          todos, offset = [], 0
          while True:
              for _ in range(6):
                  r = requests.get("https://app.advbox.com.br/api/v1/transactions",
                                   headers=h, params={"limit": 1000, "offset": offset}, timeout=60)
                  if r.status_code != 429:
                      break
                  time.sleep(30)
              time.sleep(2.2)
              if r.status_code != 200:
                  print("ERRO", r.status_code, r.text[:200]); break
              d = r.json()
              batch = d.get("data", []) or d.get("transactions", [])
              todos.extend(batch)
              if len(batch) < 1000 or offset > 400000:
                  break
              offset += 1000
          print("Total bruto lido:", len(todos))

          linhas = []
          for tx in todos:
              dp = (tx.get("date_payment") or "")[:10]
              dd = (tx.get("date_due") or "")[:10]
              if not (ini <= dp <= fim or ini <= dd <= fim):
                  continue
              linhas.append({
                  "id": tx.get("id"),
                  "valor": val(tx),
                  "entry_type": tx.get("entry_type"),
                  "debit_bank": tx.get("debit_bank"),
                  "categoria": tx.get("category_name") or tx.get("category"),
                  "date_payment": dp,
                  "date_due": dd,
                  "pago": bool(dp),
                  "tem_nome": bool(tx.get("name")),
              })

          def bucket(l):
              if l["entry_type"] != "income": return "nao_income"
              if not l["pago"]: return "nao_pago"
              if str(l["debit_bank"] or "").upper() != "ASAAS": return "banco_nao_asaas"
              if not (ini <= l["date_payment"] <= fim): return "pago_fora_do_periodo"
              return "contado_pelo_script"

          resumo = defaultdict(lambda: defaultdict(lambda: [0, 0.0]))
          for l in linhas:
              b = bucket(l)
              dia = l["date_payment"] or ("venc " + l["date_due"])
              resumo[b][dia][0] += 1
              resumo[b][dia][1] = round(resumo[b][dia][1] + l["valor"], 2)

          for b, dias in resumo.items():
              print(f"\n== {b}")
              for dia in sorted(dias):
                  n, s = dias[dia]
                  print(f"  {dia}: {n} lançamento(s) | R$ {s:.2f}")

          # lista individual só do que NÃO é contado pelo script (sem nomes)
          print("\n== Fora do que o script conta (id | valor | tipo | banco | categoria | pago em | vence)")
          for l in sorted((x for x in linhas if bucket(x) != "contado_pelo_script"), key=lambda x: (x["date_payment"], x["valor"])):
              print(f"  {l['id']} | R$ {l['valor']:.2f} | {l['entry_type']} | {l['debit_bank']} | {l['categoria']} | {l['date_payment'] or '-'} | {l['date_due']} | {bucket(l)}")

          # possíveis duplicados entre os contados (mesmo dia e mesmo valor)
          cont = defaultdict(list)
          for l in linhas:
              if bucket(l) == "contado_pelo_script":
                  cont[(l["date_payment"], l["valor"])].append(l["id"])
          print("\n== Mesmo dia e mesmo valor entre os contados (possível duplicidade)")
          for (dia, v), ids in sorted(cont.items()):
              if len(ids) > 1:
                  print(f"  {dia} | R$ {v:.2f} | ids {ids}")

          with open("auditoria_advbox_periodo.json", "w") as f:
              json.dump({"inicio": ini, "fim": fim, "lancamentos": linhas}, f, ensure_ascii=False, indent=1)
          PY

      - name: Commit resultado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f auditoria_advbox_periodo.json
          git diff --cached --quiet || git commit -m "Auditoria Advbox ${{ github.event.inputs.inicio }} a ${{ github.event.inputs.fim }}"
          git pull --rebase origin main || true
          git push || echo "Push falhou"
