name: Dar baixa em lançamento existente (paga na data informada, conta ASAAS)
on:
  workflow_dispatch:
    inputs:
      id: {description: "id do lançamento", required: true}
      data: {description: "YYYY-MM-DD", required: true}
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          TID: ${{ github.event.inputs.id }}
          DATA: ${{ github.event.inputs.data }}
        run: |
          python3 - <<'PY'
          import os, json, requests
          hb={"Authorization":f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}","User-Agent":"Mozilla/5.0","Accept":"application/json","Content-Type":"application/json"}
          u=f"https://app.advbox.com.br/api/v1/transactions/{os.environ['TID']}"
          d=requests.get(u,headers=hb,timeout=30).json()
          p={"entry_type":d["entry_type"],"users_id":d.get("users_id") or 65747,"debit_account":193264,"categories_id":d.get("categories_id"),
             "cost_centers_id":d.get("cost_centers_id"),"customers_id":d.get("customers_id"),"lawsuits_id":d.get("lawsuits_id"),
             "amount":f"{float(d['amount']):.2f}".replace(".",","),"date_due":str(d.get("date_due"))[:10],"date_payment":os.environ["DATA"],
             "description":d.get("description") or ""}
          p={k:v for k,v in p.items() if v is not None}
          r=requests.put(u,headers=hb,json=p,timeout=30)
          n=requests.get(u,headers=hb,timeout=30).json()
          out={"http":r.status_code,"resp":r.text[:200],"depois":{k:n.get(k) for k in ("amount","bank","category","cost_center","date_due","date_payment","customers_id","lawsuits_id")}}
          json.dump(out,open("baixa_resultado.json","w"),ensure_ascii=False,indent=1,default=str); print(out)
          PY
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f baixa_resultado.json; git commit -m "baixa" || true
          git pull --rebase origin main || true; git push || true
