name: Corrigir lançamentos Bemol de 08/09 (cliente, tese e centro de custo)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, time, requests
          hb={"Authorization":f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}","User-Agent":"Mozilla/5.0","Accept":"application/json","Content-Type":"application/json"}
          B="https://app.advbox.com.br/api/v1"
          def g(i): time.sleep(2.2); return requests.get(f"{B}/transactions/{i}",headers=hb,timeout=30).json()
          def put(i,d,**ch):
              p={"entry_type":d["entry_type"],"users_id":d.get("users_id") or 65747,"debit_account":193264,"categories_id":d.get("categories_id"),
                 "cost_centers_id":d.get("cost_centers_id"),"customers_id":d.get("customers_id"),"lawsuits_id":d.get("lawsuits_id"),
                 "amount":f"{float(d['amount']):.2f}".replace(".",","),"date_due":str(d.get("date_due"))[:10],
                 "date_payment":str(d.get("date_payment") or "")[:10],"description":d.get("description") or ""}
              p.update(ch); p={k:v for k,v in p.items() if v is not None}
              r=requests.put(f"{B}/transactions/{i}",headers=hb,json=p,timeout=30); time.sleep(2.2)
              return {"id":i,"http":r.status_code,"resp":r.text[:120] if r.status_code not in (200,204) else ""}
          res=[]
          # 1) 3.760,00: o lançamento do próprio cliente já existia em aberto -> baixa em 08/09; o genérico é desmarcado (não apagado)
          a=g(17516064); res.append(put(17516064,a,date_payment="2026-09-08"))
          if res[-1]["http"]==200:
              b=g(18166951); res.append(put(18166951,b,date_payment=""))
          # 2) 495,38: vincula o lançamento ao cliente/processo, copiando categoria e centro do previsto do mesmo processo
          m=g(17378397); c=g(18166953)
          res.append(put(18166953,c,customers_id=18375335,lawsuits_id=17964246,categories_id=m.get("categories_id"),cost_centers_id=m.get("cost_centers_id")))
          for i in (17516064,18166951,18166953):
              d=g(i); res.append({"conferir":i,"cat":d.get("category"),"cc":d.get("cost_center"),"cliente_id":d.get("customers_id"),"proc":d.get("lawsuits_id"),"pago":str(d.get("date_payment") or "")[:10]})
          json.dump(res,open("corrigir_bemol_resultado.json","w"),ensure_ascii=False,indent=1); print(res)
          PY
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f corrigir_bemol_resultado.json; git commit -m "corrigir bemol" || true
          git pull --rebase origin main || true; git push || true
