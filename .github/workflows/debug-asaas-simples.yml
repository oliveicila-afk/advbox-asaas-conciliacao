name: Debug Asaas Simples

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install requests
        run: pip install requests
      
      - name: Test Asaas Direct
        env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os
          import requests
          import json
          
          token = os.environ.get("ASAAS_TOKEN", "").strip()
          
          print("=" * 80)
          print("TESTE SIMPLES - BUSCAR QUALQUER TRANSAÇÃO DE SETEMBRO")
          print("=" * 80)
          
          if not token:
              print("❌ Token vazio!")
              exit(1)
          
          print(f"✓ Token recebido ({len(token)} chars)")
          
          # Teste 1: Sem datas (pega tudo)
          print("\n[1] Buscar SEM filtro de data:")
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }
          
          r = requests.get(
              "https://api.asaas.com/v3/financialTransactions",
              headers=headers,
              params={"limit": 50},
              timeout=10
          )
          
          print(f"  Status: {r.status_code}")
          if r.status_code == 200:
              data = r.json()
              print(f"  Total transações: {len(data.get('data', []))}")
              for tx in data.get('data', [])[:3]:
                  print(f"    - {tx.get('date')} | {tx.get('type')} | R$ {tx.get('value')}")
          else:
              print(f"  ❌ Erro: {r.text[:200]}")
          
          # Teste 2: Com datas de setembro
          print("\n[2] Buscar COM datas de setembro (2026-09-01 a 2026-09-30):")
          params = {
              "startDate": "2026-09-01",
              "finishDate": "2026-09-30",
              "limit": 50
          }
          
          r = requests.get(
              "https://api.asaas.com/v3/financialTransactions",
              headers=headers,
              params=params,
              timeout=10
          )
          
          print(f"  Status: {r.status_code}")
          if r.status_code == 200:
              data = r.json()
              txs = data.get('data', [])
              print(f"  ✓ Total transações em setembro: {len(txs)}")
              for tx in txs:
                  print(f"    - {tx.get('date')} | {tx.get('type')} | R$ {tx.get('value')}")
          else:
              print(f"  ❌ Erro: {r.text[:200]}")
          
          PYEOF
