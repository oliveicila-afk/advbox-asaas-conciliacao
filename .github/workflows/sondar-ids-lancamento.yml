name: Sondar ids de categoria/centro/cliente (somente leitura)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, requests
          hb = {"Authorization": f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}", "User-Agent": "Mozilla/5.0", "Accept": "application/json"}
          B = "https://app.advbox.com.br/api/v1"
          out = {}
          for i in (17774989, 17774990, 17774992, 17774994, 17774998):
              r = requests.get(f"{B}/transactions/{i}", headers=hb, timeout=30)
              try: j = r.json()
              except Exception: j = r.text[:200]
              if isinstance(j, dict):
                  j = {k: v for k, v in j.items() if k not in ("name", "description", "identification")}
              out[i] = {"http": r.status_code, "d": j}
          r = requests.get(f"{B}/settings", headers=hb, timeout=30)
          try: s = r.json()
          except Exception: s = r.text[:200]
          out["settings_keys"] = list(s.keys()) if isinstance(s, dict) else str(type(s))
          out["settings_http"] = r.status_code
          json.dump(out, open("sonda_ids.json", "w"), ensure_ascii=False, indent=1, default=str)
          PY
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f sonda_ids.json; git commit -m "sonda ids" || true
          git pull --rebase origin main || true; git push || true
