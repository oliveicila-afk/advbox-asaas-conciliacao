name: Verificar Elisabeth e Desbloqueio - Setembro 2026

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, requests, re

          ha = {"access_token": os.environ["ASAAS_TOKEN"].strip(), "Accept": "application/json"}
          A = "https://api.asaas.com/v3"

          # Busca todos os dias de setembro
          all_sep = []
          for dia in range(1, 31):
              target_date = f"2026-09-{dia:02d}"
              off = 0
              while True:
                  r = requests.get(f"{A}/financialTransactions",
                                   headers=ha,
                                   params={"startDate": target_date, "finishDate": target_date, "limit": 100, "offset": off},
                                   timeout=30)
                  data = r.json().get("data", [])
                  all_sep.extend(data)
                  if not r.json().get("hasMore") or not data:
                      break
                  off += 100

          print(f"Total transações setembro: {len(all_sep)}")

          # ─── 1. TODAS as transações relacionadas à Elisabeth ───────────────
          elisabeth = [t for t in all_sep if "ELISABETH" in str(t.get("description","")).upper()
                       or "ELISABETH" in str(t.get("type","")).upper()]

          print(f"\n=== ELISABETH BRITTO DA COSTA — todas as transações de setembro ({len(elisabeth)}) ===")
          soma_pos = 0.0
          soma_neg = 0.0
          for t in sorted(elisabeth, key=lambda x: str(x.get("date",""))):
              v = float(t.get("value", 0))
              sinal = "📥" if v > 0 else "📤"
              if v > 0: soma_pos += v
              else: soma_neg += v
              print(f"  {sinal} {str(t.get('date',''))[:10]} | tipo: {t.get('type')} | R$ {v:.2f}")
              print(f"     desc: {t.get('description','')[:120]}")
          print(f"\n  Soma entradas (positivas): R$ {soma_pos:.2f}")
          print(f"  Soma saídas  (negativas):  R$ {soma_neg:.2f}")
          print(f"  Saldo líquido Elisabeth:   R$ {soma_pos + soma_neg:.2f}")

          # ─── 2. DESBLOQUEIO DE SALDO ──────────────────────────────────────
          desbloqueio = [t for t in all_sep if "DESBLOQUEIO" in str(t.get("description","")).upper()
                         or "DESBLOQUEIO" in str(t.get("type","")).upper()
                         or "BALANCE_UNBLOCK" in str(t.get("type","")).upper()
                         or "UNBLOCK" in str(t.get("type","")).upper()]

          print(f"\n=== DESBLOQUEIO DE SALDO — todas as ocorrências de setembro ({len(desbloqueio)}) ===")
          for t in sorted(desbloqueio, key=lambda x: str(x.get("date",""))):
              print(f"  📥 {str(t.get('date',''))[:10]} | tipo: {t.get('type')} | R$ {float(t.get('value',0)):.2f}")
              print(f"     desc: {t.get('description','')[:200]}")
              print(f"     id: {t.get('id')}")
              # Todos os campos disponíveis
              campos_extra = {k: v for k, v in t.items() if k not in ("type","value","date","description","id") and v}
              if campos_extra:
                  print(f"     outros campos: {json.dumps(campos_extra, ensure_ascii=False)[:300]}")

          if not desbloqueio:
              # Buscar por valor 1000 em tipos não usuais
              mil = [t for t in all_sep if abs(float(t.get("value",0))) == 1000.0
                     and t.get("type") not in ("PAYMENT_RECEIVED","PAYMENT_REVERSAL","RECEIVABLE_ANTICIPATION_GROSS_CREDIT","PAYMENT_FEE_REVERSAL")]
              print(f"  (nenhum encontrado com palavra 'DESBLOQUEIO' — buscando R$ 1.000 em tipos não usuais: {len(mil)} resultado(s))")
              for t in mil:
                  print(f"  📥 {str(t.get('date',''))[:10]} | tipo: {t.get('type')} | R$ {float(t.get('value',0)):.2f}")
                  print(f"     desc: {t.get('description','')[:200]}")
                  print(f"     id: {t.get('id')}")
                  print(f"     todos campos: {json.dumps(t, ensure_ascii=False)[:500]}")

          # ─── 3. RESUMO TODOS OS TIPOS de setembro ─────────────────────────
          from collections import defaultdict
          por_tipo = defaultdict(lambda: {"qtd": 0, "soma": 0.0})
          for t in all_sep:
              por_tipo[t.get("type")]["qtd"] += 1
              por_tipo[t.get("type")]["soma"] += float(t.get("value", 0))

          print(f"\n=== TODOS OS TIPOS de setembro ===")
          for tipo in sorted(por_tipo):
              info = por_tipo[tipo]
              print(f"  {tipo}: {info['qtd']} transações | soma R$ {info['soma']:.2f}")

          resultado = {
              "elisabeth": [
                  {"data": str(t.get("date",""))[:10], "tipo": t.get("type"),
                   "valor": float(t.get("value",0)), "desc": t.get("description","")[:150]}
                  for t in sorted(elisabeth, key=lambda x: str(x.get("date","")))
              ],
              "desbloqueio": [
                  {k: v for k, v in t.items()}
                  for t in desbloqueio
              ],
              "saldo_liquido_elisabeth": round(soma_pos + soma_neg, 2),
              "tipos_setembro": {t: {"qtd": v["qtd"], "soma": round(v["soma"], 2)} for t, v in por_tipo.items()}
          }
          json.dump(resultado, open("elisabeth_desbloqueio_setembro.json", "w"), ensure_ascii=False, indent=2)
          print("\nResultado salvo em elisabeth_desbloqueio_setembro.json")
          PY
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f elisabeth_desbloqueio_setembro.json
          git commit -m "verificar elisabeth e desbloqueio setembro" || true
          git pull --rebase origin main || true
          git push || true
