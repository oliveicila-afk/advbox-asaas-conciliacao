name: Checagem - andamento dos recebimentos parciais (somente leitura)

on:
  workflow_dispatch:

jobs:
  andamento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Ler tarefas dos processos com recebimento menor
        env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
        working-directory: checagem-exito
        run: python checar_andamento_seis.py
