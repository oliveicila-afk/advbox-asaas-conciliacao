name: Verificar Resultado Reconciliação

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install requests
        run: pip install requests
      
      - name: Fetch and compare
        env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os
          import requests
          import json
          
          asaas_token = os.environ.get("ASAAS_TOKEN", "").strip()
          advbox_token = os.environ.get("ADVBOX_TOKEN", "").strip()
          
          print("=" * 80)
          print("VERIFICAR RESULTADO DA RECONCILIAÇÃO")
          print("=" * 80)
          
          # Asaas
          print("\n[ASAAS - 2026-09-01]")
          headers_asaas = {
              "access_token": asaas_token,
              "Accept": "application/json"
          }
          
          r = requests.get(
              "https://api.asaas.com/v3/financialTransactions",
              headers=headers_asaas,
              params={
                  "startDate": "2026-09-01",
                  "finishDate": "2026-09-01",
                  "limit": 100
              },
              timeout=30
          )
          
          print(f"Status: {r.status_code}")
          if r.status_code == 200:
              data = r.json()
              txs = data.get("data", [])
              print(f"Transações encontradas: {len(txs)}")
              total = sum(float(tx.get("value", 0)) for tx in txs)
              print(f"Total: R$ {total:,.2f}")
              for tx in txs:
                  print(f"  - {tx.get('date')} | {tx.get('type')} | R$ {tx.get('value')}")
          else:
              print(f"Erro: {r.text[:200]}")
          
          # Advbox
          print("\n[ADVBOX - 2026-09-01]")
          headers_advbox = {
              "Authorization": f"Bearer {advbox_token}",
              "Accept": "application/json"
          }
          
          r = requests.get(
              "https://app.advbox.com.br/api/v1/transactions",
              headers=headers_advbox,
              params={"limit": 1000, "offset": 0},
              timeout=30
          )
          
          print(f"Status: {r.status_code}")
          if r.status_code == 200:
              data = r.json()
              txs = data if isinstance(data, list) else data.get("data", [])
              
              # Filter for 2026-09-01
              filtered = []
              for tx in txs:
                  date = tx.get("payment_date", tx.get("date_payment", ""))
                  if date and date.startswith("2026-09-01"):
                      filtered.append(tx)
              
              print(f"Transações em 2026-09-01: {len(filtered)}")
              total = sum(float(tx.get("value", tx.get("amount", 0)) or 0) for tx in filtered)
              print(f"Total: R$ {total:,.2f}")
              for tx in filtered:
                  amount = float(tx.get("value", tx.get("amount", 0)) or 0)
                  date = tx.get("payment_date", tx.get("date_payment", ""))
                  print(f"  - {date} | {amount:,.2f}")
          else:
              print(f"Erro: {r.text[:200]}")
          
          PYEOF
