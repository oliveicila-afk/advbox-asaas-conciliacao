name: Checar se valores existem no Asaas em um dia (somente leitura)
on:
  workflow_dispatch:
    inputs:
      dia: {description: "YYYY-MM-DD", required: true, default: "2026-10-13"}
      valores: {description: "valores separados por virgula", required: true, default: "67.00,110.00,285.85"}
permissions:
  contents: write
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
          DIA: ${{ github.event.inputs.dia }}
          VALORES: ${{ github.event.inputs.valores }}
        run: |
          python3 - <<'PY'
          import os, json, requests
          ha={"access_token":os.environ["ASAAS_TOKEN"].strip(),"Accept":"application/json"}
          vals=[round(float(v),2) for v in os.environ["VALORES"].split(",")]; out={v:[] for v in vals}; off=0
          while True:
              j=requests.get("https://api.asaas.com/v3/financialTransactions",headers=ha,params={"startDate":os.environ["DIA"],"finishDate":os.environ["DIA"],"limit":100,"offset":off},timeout=30).json()
              for t in j.get("data",[]):
                  v=round(float(t.get("value",0)),2)
                  if v in out: out[v].append(t.get("type"))
              if not j.get("hasMore") or not j.get("data"): break
              off+=100
          json.dump({str(k):v for k,v in out.items()},open("checar_valores_asaas.json","w"),indent=1); print(out)
          PY
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add checar_valores_asaas.json; git commit -qm "checar valores" || true; git pull -q --rebase; git push -q
