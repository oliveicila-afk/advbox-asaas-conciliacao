name: Atualizar TEDs com Cliente e Processo

on:
  workflow_dispatch:

jobs:
  atualizar_teds:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Atualizar TEDs
        env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          ASAAS_CHAVE: ${{ secrets.ASAAS_CHAVE }}
        run: |
          python scripts/atualizar_teds_com_cliente_processo.py "$ADVBOX_TOKEN" "$ASAAS_CHAVE"
