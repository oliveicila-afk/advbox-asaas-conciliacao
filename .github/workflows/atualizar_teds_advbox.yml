name: Atualizar TEDs com Cliente e Processo

on:
  workflow_dispatch:

jobs:
  atualizar_teds:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Atualizar TEDs
        run: |
          python scripts/atualizar_teds_com_cliente_processo.py "${{ secrets.ADVBOX_TOKEN }}" "${{ secrets.ASAAS_TOKEN }}"
