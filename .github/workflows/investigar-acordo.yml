name: Investigar acordo (processo → cliente → tese → lançamentos) — somente leitura
on:
  workflow_dispatch:
    inputs:
      processo:
        description: "Número do processo (CNJ)"
        required: true
permissions:
  contents: write
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          PROC: ${{ github.event.inputs.processo }}
        run: |
          python3 - <<'PY'
          import os, re, time, json, unicodedata, requests
          hb = {"Authorization": f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}", "User-Agent": "Mozilla/5.0", "Accept": "application/json"}
          B = "https://app.advbox.com.br/api/v1"
          dig = lambda s: re.sub(r"\D", "", str(s or ""))
          alvo = dig(os.environ["PROC"])
          def ini(s):
              s = unicodedata.normalize("NFKD", str(s or "")).encode("ascii","ignore").decode()
              return " ".join(p[0] for p in s.upper().split() if p) or "-"
          def pag(path):
              out, off = [], 0
              while True:
                  for _ in range(6):
                      r = requests.get(f"{B}/{path}", headers=hb, params={"limit":1000,"offset":off}, timeout=90)
                      if r.status_code != 429: break
                      time.sleep(30)
                  time.sleep(2.2)
                  if r.status_code != 200: break
                  b = r.json().get("data", []); out += b
                  if len(b) < 1000: break
                  off += 1000
              return out
          lw = [l for l in pag("lawsuits") if alvo in (dig(l.get("process_number")), dig(l.get("protocol_number")))]
          res = {"processos": []}
          trs = pag("transactions")
          for l in lw:
              cl = [c for c in (l.get("customers") or []) if isinstance(c, dict)]
              nomes = {ini(c.get("name")) for c in cl}
              lan = [{"id": t.get("id"), "tipo": t.get("entry_type"), "valor": t.get("amount"), "categoria": t.get("category"),
                      "centro": t.get("cost_center"), "pago": str(t.get("date_payment") or "")[:10], "venc": str(t.get("date_due") or "")[:10],
                      "banco": t.get("debit_bank") or t.get("credit_bank")}
                     for t in trs if t.get("lawsuit_id") == l.get("id") or (t.get("name") and ini(t.get("name")) in nomes and False)]
              res["processos"].append({"lawsuits_id": l.get("id"), "tese": l.get("type"), "grupo": l.get("group"),
                                       "clientes": sorted(nomes), "lancamentos": lan})
          json.dump(res, open("investigar_acordo.json", "w"), ensure_ascii=False, indent=1, default=str)
          print(json.dumps(res, ensure_ascii=False, default=str)[:1500])
          PY
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f investigar_acordo.json; git commit -m "investigar acordo" || true
          git pull --rebase origin main || true; git push || true
