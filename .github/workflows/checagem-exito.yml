name: Checagem de recebimento de êxito (Asaas -> Advbox)

on:
  schedule:
    # A cada 30 min entre 8h e 19h30 de Cuiabá (UTC-4) = 12h às 23h30 UTC
    - cron: '*/30 12-23 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: "Dia a checar (AAAA-MM-DD). Em branco = hoje."
        required: false
        default: ""
      dry_run:
        description: "true = só simula, não grava no Advbox"
        required: false
        default: "true"

# Nunca duas checagens ao mesmo tempo sobre os mesmos lançamentos
concurrency:
  group: checagem-exito
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Checar recebimentos de êxito
        env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
          TIMEZONE: "America/Cuiaba"
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python checagem-exito/checar_recebimento_exito.py
