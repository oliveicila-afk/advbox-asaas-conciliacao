name: Checagem de recebimento de êxito (regra do líquido, tolerância R$110)

on:
  schedule:
    # 9h e 15h de Cuiabá (UTC-4) = 13h e 19h UTC. Execução automática grava (APLICAR=true).
    - cron: '0 13,19 * * *'
  workflow_dispatch:
    inputs:
      aplicar:
        description: "false = só simula; true = grava (data e, no caso pendente, valor e tarefa)"
        required: true
        default: "false"
      ids:
        description: "ids específicos ou * para todos os que se enquadram"
        required: false
        default: "*"

concurrency:
  group: checagem-exito
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Aplicar regra do líquido
        env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
          APLICAR: ${{ github.event.inputs.aplicar || (github.event_name == 'schedule' && 'true') || 'false' }}
          IDS: ${{ github.event.inputs.ids || '*' }}
        working-directory: checagem-exito
        run: python aplicar_regra_liquido.py
