name: Reconciliação Setembro - Com Artefato

on:
  workflow_dispatch:

jobs:
  reconciliacao:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Executar Reconciliação
        env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          TIMEZONE: America/Manaus
        run: |
          python reconciliacao_setembro_criar_entradas.py --auto 2>&1 | tee reconciliacao_output.txt
          echo "Exit code: $?" >> reconciliacao_output.txt

      - name: Upload Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconciliacao-output
          path: reconciliacao_output.txt
          retention-days: 7
