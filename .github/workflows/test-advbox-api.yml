name: Test Advbox API Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Test Advbox API
        env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: |
          python3 << 'EOF'
          import os
          import requests

          token = os.environ.get("ADVBOX_TOKEN", "")
          print(f"Token length: {len(token)}")
          print(f"Token valid: {bool(token)}")

          if token:
            headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
            }

            # Test 1: GET /users
            print("\n=== Test 1: GET /users ===")
            try:
              resp = requests.get("https://app.advbox.com.br/api/v1/users", headers=headers, timeout=10)
              print(f"Status: {resp.status_code}")
              if resp.status_code == 200:
                print("✅ API is working!")
              else:
                print(f"Response: {resp.text[:500]}")
            except Exception as e:
              print(f"❌ Error: {e}")

            # Test 2: Check for transactions endpoint
            print("\n=== Test 2: GET /transactions (empty) ===")
            try:
              resp = requests.get("https://app.advbox.com.br/api/v1/transactions",
                                headers=headers,
                                params={"limit": 1},
                                timeout=10)
              print(f"Status: {resp.status_code}")
              if resp.status_code == 200:
                print("✅ Transactions endpoint working!")
                data = resp.json()
                print(f"Response keys: {list(data.keys())[:5]}")
              else:
                print(f"Response: {resp.text[:500]}")
            except Exception as e:
              print(f"❌ Error: {e}")
          else:
            print("❌ ADVBOX_TOKEN not set")
          EOF
