name: Buscar desbloqueios em outros meses

on:
  workflow_dispatch:

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, requests

          asaas_token = os.environ["ASAAS_TOKEN"].strip()
          ha = {"access_token": asaas_token, "Accept": "application/json"}

          print("🔍 Buscando DEBIT_REVERSAL em agosto 2026...\n")
          all_aug = []
          for dia in range(1, 32):
              d = f"2026-08-{dia:02d}"
              off = 0
              while True:
                  r = requests.get("https://api.asaas.com/v3/financialTransactions",
                                    headers=ha,
                                    params={"startDate": d, "finishDate": d, "limit": 100, "offset": off},
                                    timeout=30)
                  batch = r.json().get("data", [])
                  all_aug.extend(batch)
                  if not r.json().get("hasMore") or not batch:
                      break
                  off += 100

          debit_reversals_aug = [t for t in all_aug if t.get("type") == "DEBIT_REVERSAL"]
          print(f"Agosto: {len(debit_reversals_aug)} DEBIT_REVERSAL(s)")
          total_aug = sum(float(t.get("value", 0)) for t in debit_reversals_aug)
          if debit_reversals_aug:
              print(f"Total agosto: R$ {total_aug:.2f}")
              for t in debit_reversals_aug:
                  print(f"  - {t.get('date', '')}: R$ {t.get('value', 0)}")

          print("\n🔍 Buscando DEBIT_REVERSAL em outubro 2026...\n")
          all_oct = []
          for dia in range(1, 32):
              d = f"2026-10-{dia:02d}"
              off = 0
              while True:
                  r = requests.get("https://api.asaas.com/v3/financialTransactions",
                                    headers=ha,
                                    params={"startDate": d, "finishDate": d, "limit": 100, "offset": off},
                                    timeout=30)
                  batch = r.json().get("data", [])
                  all_oct.extend(batch)
                  if not r.json().get("hasMore") or not batch:
                      break
                  off += 100

          debit_reversals_oct = [t for t in all_oct if t.get("type") == "DEBIT_REVERSAL"]
          print(f"Outubro: {len(debit_reversals_oct)} DEBIT_REVERSAL(s)")
          total_oct = sum(float(t.get("value", 0)) for t in debit_reversals_oct)
          if debit_reversals_oct:
              print(f"Total outubro: R$ {total_oct:.2f}")
              for t in debit_reversals_oct:
                  print(f"  - {t.get('date', '')}: R$ {t.get('value', 0)}")

          total_other = total_aug + total_oct
          print(f"\n📊 Resumo:\n  Setembro: R$ 1.000,00\n  Outros meses: R$ {total_other:.2f}\n  Total: R$ {1000 + total_other:.2f}")
          PY
