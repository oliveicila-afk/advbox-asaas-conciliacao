name: Achar lançamento 248,50 da Simone V. (somente leitura)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, re, time, json, unicodedata, requests
          hb = {"Authorization": f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}", "User-Agent": "Mozilla/5.0", "Accept": "application/json"}
          B="https://app.advbox.com.br/api/v1"
          norm=lambda s: re.sub(r"\s+"," ",unicodedata.normalize("NFKD",str(s or "")).encode("ascii","ignore").decode()).strip().upper()
          res=[]; off=0
          while True:
              for _ in range(6):
                  r=requests.get(f"{B}/transactions",headers=hb,params={"limit":1000,"offset":off},timeout=90)
                  if r.status_code!=429: break
                  time.sleep(30)
              time.sleep(2.2)
              b=r.json().get("data",[])
              for t in b:
                  if norm(t.get("name")).startswith("SIMONE VILLANOVA") and t.get("entry_type")=="income":
                      res.append({"id":t["id"],"valor":t.get("amount"),"pago":str(t.get("date_payment") or "")[:10],"venc":str(t.get("date_due") or "")[:10],"banco":t.get("debit_bank"),"categoria":t.get("category"),"competencia":t.get("competence")})
              if len(b)<1000: break
              off+=1000
          for x in res:
              if x["valor"]==248.5:
                  d=requests.get(f"{B}/transactions/{x['id']}",headers=hb,timeout=30).json(); time.sleep(2.2)
                  x["criado_em"]=d.get("created_at"); x["atualizado_em"]=d.get("updated_at")
          json.dump(res,open("achar_simone.json","w"),ensure_ascii=False,indent=1,default=str)
          PY
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f achar_simone.json; git commit -m "achar simone" || true
          git pull --rebase origin main || true; git push || true
