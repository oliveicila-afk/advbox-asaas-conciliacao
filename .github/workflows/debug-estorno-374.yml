name: Debug estorno 374,25 (somente leitura)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, requests
          ha={"access_token":os.environ["ASAAS_TOKEN"].strip(),"Accept":"application/json"}
          out=[]
          for dia in ("2026-09-08","2026-09-09","2026-09-10"):
              off=0
              while True:
                  j=requests.get("https://api.asaas.com/v3/financialTransactions",headers=ha,params={"startDate":dia,"finishDate":dia,"limit":100,"offset":off},timeout=30).json()
                  for t in j.get("data",[]):
                      if abs(abs(float(t.get("value",0)))-374.25)<0.005:
                          out.append({"dia":dia,"keys":sorted(t.keys()),"type":t.get("type"),"value":t.get("value"),"description_tem_fatura":"fatura nr." in str(t.get("description")),"description_ini":str(t.get("description"))[:40],"paymentId":bool(t.get("paymentId")),"anticipationId":bool(t.get("anticipationId")),"date":t.get("date")})
                  if not j.get("hasMore") or not j.get("data"): break
                  off+=100
          json.dump(out,open("debug_estorno.json","w"),indent=1); print(out)
          PY
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add debug_estorno.json; git commit -qm "debug estorno" || true; git pull -q --rebase; git push -q
