name: Ver categorias e lançamentos com categoria genérica (somente leitura)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, time, requests
          from collections import Counter
          hb={"Authorization":f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}","User-Agent":"Mozilla/5.0","Accept":"application/json"}
          B="https://app.advbox.com.br/api/v1"
          st=requests.get(f"{B}/settings",headers=hb,timeout=60).json().get("financial",{}); time.sleep(2.2)
          cats=sorted(c["category"] for c in st["categories"])
          todas=[]; off=0
          while True:
              r=requests.get(f"{B}/transactions",headers=hb,params={"limit":1000,"offset":off},timeout=90); time.sleep(2.2)
              b=r.json().get("data",[]); todas+=b
              if len(b)<1000: break
              off+=1000
          nomes=set(cats)
          gen=[t for t in todas if t.get("entry_type")=="income" and str(t.get("category") or "") in ("HONORÁRIOS CONTRATUAIS","HONORÁRIOS INICIAIS","HONORÁRIOS FINAIS","HONORÁRIOS DE SUCUMBÊNCIA","HONORÁRIOS POR MENSALIDADE")]
          out={"categorias":cats,
               "genericos":Counter((t.get("category"),bool(t.get("date_payment")),str(t.get("debit_bank") or "")) for t in gen).most_common(),
               "exemplos":[{"id":t["id"],"cat":t.get("category"),"valor":t.get("amount"),"pago":str(t.get("date_payment") or "")[:10],"lawsuit":t.get("lawsuit_id"),"cc":t.get("cost_center")} for t in gen[:15]],
               "categoria_existe_na_lista":{c:(c in nomes) for c in set(str(t.get("category") or "") for t in gen)}}
          json.dump(out,open("ver_categorias_genericas.json","w"),ensure_ascii=False,indent=1)
          PY
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ver_categorias_genericas.json; git commit -m "ver categorias" || true
          git pull --rebase origin main || true; git push || true
