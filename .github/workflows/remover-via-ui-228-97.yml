name: Remover R$ 228,97 via UI Advbox

on:
  workflow_dispatch:
    inputs:
      advbox_email:
        description: 'Email de acesso Advbox'
        required: true
      advbox_password:
        description: 'Senha de acesso Advbox (usar secret)'
        required: true

jobs:
  remove-via-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Instalar Playwright
        run: |
          pip install playwright -q
          playwright install chromium

      - name: Buscar e remover R$ 228,97 no Advbox via UI
        env:
          ADVBOX_EMAIL: ${{ github.event.inputs.advbox_email }}
          ADVBOX_PASSWORD: ${{ github.event.inputs.advbox_password }}
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os
          import requests
          import json
          import time
          from datetime import datetime
          from playwright.sync_api import sync_playwright

          asaas_token = os.environ.get("ASAAS_TOKEN", "").strip()
          advbox_email = os.environ.get("ADVBOX_EMAIL", "").strip()
          advbox_password = os.environ.get("ADVBOX_PASSWORD", "").strip()

          if not asaas_token or not advbox_email or not advbox_password:
              print("ERRO: Dados de acesso nao configurados!")
              exit(1)

          print("=" * 80)
          print("PASSO 1: Buscar R$ 248,50 no ASAAS")
          print("=" * 80)

          headers_asaas = {
              "access_token": asaas_token,
              "Accept": "application/json"
          }

          asaas_248_descriptions = []
          try:
              r = requests.get(
                  "https://api.asaas.com/v3/financialTransactions?offset=0&limit=500",
                  headers=headers_asaas,
                  timeout=30
              )
              if r.status_code == 200:
                  data = r.json()
                  for txn in data.get("data", []):
                      val = txn.get("value")
                      if val:
                          try:
                              v = float(val) if isinstance(val, (int, float)) else float(str(val).replace(",", "."))
                              if abs(v - 248.50) < 0.01:
                                  asaas_248_descriptions.append(txn.get('description', ''))
                          except:
                              pass
              print(f"Encontradas {len(asaas_248_descriptions)} transacoes de R$ 248,50 no ASAAS")
              for desc in asaas_248_descriptions[:5]:
                  print(f"  - {desc[:70]}")
          except Exception as e:
              print(f"ERRO ao buscar ASAAS: {str(e)}")

          print("\n" + "=" * 80)
          print("PASSO 2: Acessar Advbox e localizar transacao R$ 228,97")
          print("=" * 80)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context()
              page = context.new_page()

              try:
                  # Acessar login Advbox
                  print("Acessando https://app.advbox.com.br...")
                  page.goto("https://app.advbox.com.br", wait_until="networkidle", timeout=30000)

                  # Tentar encontrar e preencher formulario de login
                  time.sleep(2)

                  # Procurar por campo de email/login
                  email_selector = None
                  password_selector = None

                  # Tenta varios seletores comuns
                  for sel in ['input[type="email"]', 'input[name="email"]', 'input[id*="email"]', 'input[placeholder*="email"]', '#email', '[name="login"]']:
                      try:
                          if page.locator(sel).is_visible():
                              email_selector = sel
                              break
                      except:
                          pass

                  for sel in ['input[type="password"]', 'input[name="password"]', 'input[id*="password"]', '#password']:
                      try:
                          if page.locator(sel).is_visible():
                              password_selector = sel
                              break
                      except:
                          pass

                  if email_selector and password_selector:
                      print(f"Preenchendo credenciais...")
                      page.fill(email_selector, advbox_email)
                      page.fill(password_selector, advbox_password)

                      # Procurar botao de login
                      for sel in ['button:has-text("Entrar")', 'button:has-text("Login")', 'button[type="submit"]', 'button:has-text("Acessar")']:
                          try:
                              if page.locator(sel).is_visible():
                                  page.click(sel)
                                  break
                          except:
                              pass

                      print("Aguardando autenticacao...")
                      time.sleep(5)
                      page.wait_for_load_state("networkidle", timeout=30000)

                  # Navegar para transacoes
                  print("Navegando para secao de Lancamentos/Transacoes...")

                  # Procurar links de navegacao
                  links_to_try = [
                      "Lançamentos",
                      "Lancamentos",
                      "Transações",
                      "Transacoes",
                      "Entradas",
                      "Receitas"
                  ]

                  navegou = False
                  for link_text in links_to_try:
                      try:
                          links = page.locator(f'a:has-text("{link_text}")')
                          if links.count() > 0:
                              links.first.click()
                              time.sleep(3)
                              page.wait_for_load_state("networkidle", timeout=30000)
                              navegou = True
                              print(f"Acessou: {link_text}")
                              break
                      except:
                          pass

                  if not navegou:
                      print("Nao conseguiu navegar para transacoes automaticamente")
                      print("Verifique a estrutura da UI do Advbox")

                  # Procurar transacao de R$ 228,97
                  print("\nProcurando por transacoes de R$ 228,97 ou R$ 248,50...")

                  # Procura na pagina atual
                  content = page.content()

                  if "228,97" in content or "228.97" in content:
                      print("ENCONTRADA: Transacao de R$ 228,97 visivel na pagina")
                      print("\nINSTRUCOES PARA REMOCAO MANUAL:")
                      print("1. Localize a transacao com valor R$ 228,97 ou R$ 248,50")
                      print("2. Procure na descricao por UMA das opcoes abaixo que NENHUMA delas combina com ASAAS:")
                      asaas_desc_formatted = "\n".join([f"     - {desc[:70]}" for desc in asaas_248_descriptions[:5]])
                      print(asaas_desc_formatted)
                      print("3. Clique em 'Remover', 'Reverter', 'Desmarcar' ou similar")
                      print("4. Confirme a remocao")
                      print("5. Execute a reconciliacao novamente")
                  else:
                      print("Transacao nao visivel na pagina atual")

                  # Tirar screenshot da pagina
                  screenshot_path = "/tmp/advbox_transacoes.png"
                  page.screenshot(path=screenshot_path)
                  print(f"\nScreenshot salvo: {screenshot_path}")

              except Exception as e:
                  print(f"ERRO durante navegacao: {str(e)}")
              finally:
                  browser.close()

          print("\n" + "=" * 80)
          print("RESUMO")
          print("=" * 80)
          print("\nComo o acesso via API nao funcionou, a transacao deve ser removida manualmente:")
          print("\n5 transacoes de R$ 248,50 encontradas no ASAAS:")
          for i, desc in enumerate(asaas_248_descriptions[:5], 1):
              print(f"  {i}. {desc[:70]}")
          print("\nA transacao em Advbox que NAO corresponde a nenhuma destas 5")
          print("eh a que deve ser removida (valor R$ 228,97 ou R$ 248,50)")

          PYTHON_SCRIPT
