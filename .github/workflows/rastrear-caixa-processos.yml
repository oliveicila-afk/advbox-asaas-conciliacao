name: Rastrear repasses da Caixa — processo no Asaas → Advbox (somente leitura, sem nomes)

on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Datas separadas por vírgula (YYYY-MM-DD)"
        required: true
        default: "2026-09-14,2026-09-16,2026-09-17,2026-09-18"
      pagador:
        description: "Trecho do nome do pagador no Asaas"
        required: true
        default: "CAIXA"

permissions:
  contents: write

jobs:
  rastrear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - name: Ler pagamentos da Caixa no Asaas e achar o processo no Advbox
        env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          DIAS: ${{ github.event.inputs.dias }}
          PAGADOR: ${{ github.event.inputs.pagador }}
        run: |
          python3 - <<'PY'
          import os, re, time, json, unicodedata, requests

          ha = {"access_token": os.environ["ASAAS_TOKEN"].strip(), "Accept": "application/json"}
          hb = {"Authorization": f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}", "User-Agent": "Mozilla/5.0", "Accept": "application/json"}
          base = "https://api.asaas.com/v3"
          pagador = os.environ["PAGADOR"].strip().upper()
          dias = [d.strip() for d in os.environ["DIAS"].split(",") if d.strip()]

          def ini(s):
              s = unicodedata.normalize("NFKD", str(s or "")).encode("ascii", "ignore").decode()
              return " ".join(p[0] for p in s.upper().split() if p) or "-"
          def norm(s):
              return unicodedata.normalize("NFKD", str(s or "")).encode("ascii", "ignore").decode().upper()
          cnj_re = re.compile(r"\d{7}-?\d{2}\.?\d{4}\.?\d\.?\d{2}\.?\d{4}")
          def so_digitos(s): return re.sub(r"\D", "", str(s or ""))
          def cnjs(txt):
              return list({so_digitos(m.group(0)) for m in cnj_re.finditer(str(txt or "")) if len(so_digitos(m.group(0))) == 20})

          # 1) pagamentos da Caixa no Asaas
          pagos, cache_cli = [], {}
          for dia in dias:
              off, txs = 0, []
              while True:
                  r = requests.get(f"{base}/financialTransactions", headers=ha,
                                   params={"startDate": dia, "finishDate": dia, "limit": 100, "offset": off}, timeout=30).json()
                  txs += r.get("data", [])
                  if not r.get("hasMore") or not r.get("data"): break
                  off += 100
              for t in txs:
                  if t.get("type") != "PAYMENT_RECEIVED" or not t.get("paymentId"): continue
                  p = requests.get(f"{base}/payments/{t['paymentId']}", headers=ha, timeout=30).json()
                  cid = p.get("customer")
                  if cid not in cache_cli:
                      cache_cli[cid] = requests.get(f"{base}/customers/{cid}", headers=ha, timeout=30).json()
                  nome = norm((cache_cli[cid] or {}).get("name"))
                  if pagador not in nome: continue
                  campos = " | ".join(str(p.get(k) or "") for k in ("description", "externalReference"))
                  longas = re.findall(r"\d[\d\-\.\/]{18,}\d", campos)
                  pagos.append({"dia": dia, "valor": t.get("value"), "paymentId": t["paymentId"],
                                "fatura_nr": p.get("invoiceNumber"), "billingType": p.get("billingType"),
                                "descricao_mascarada": re.sub(r"\d", "#", campos)[:300],
                                "longas": [so_digitos(x) for x in longas],
                                "cnjs": [], "n_cnjs": 0})
          print("pagamentos do pagador:", len(pagos))

          # 2) processos do Advbox
          lw, off = [], 0
          while True:
              for _ in range(6):
                  r = requests.get("https://app.advbox.com.br/api/v1/lawsuits", headers=hb, params={"limit": 1000, "offset": off}, timeout=90)
                  if r.status_code != 429: break
                  time.sleep(30)
              time.sleep(2.2)
              if r.status_code != 200: print("ERRO lawsuits", r.status_code); break
              b = r.json().get("data", []); lw += b
              if len(b) < 1000: break
              off += 1000
          idx = {}
          for l in lw:
              for k in ("process_number", "protocol_number"):
                  d = so_digitos(l.get(k))
                  if len(d) == 20: idx[d] = l
          print("processos Advbox:", len(lw), "| indexados por CNJ:", len(idx))

          saida = []
          for p in pagos:
              achados = []
              for ds in p["longas"]:
                  for off in range(0, len(ds) - 19):
                      c = ds[off:off + 20]
                      l = idx.get(c)
                      if l:
                          achados.append({"janela": [off, len(ds)], "lawsuits_id": l.get("id"),
                                          "tipo": (l.get("type") or {}).get("name") if isinstance(l.get("type"), dict) else l.get("type"),
                                          "grupo": (l.get("group") or {}).get("name") if isinstance(l.get("group"), dict) else l.get("group"),
                                          "clientes": [ini(c2.get("name")) for c2 in (l.get("customers") or []) if isinstance(c2, dict)],
                                          "status_closure": l.get("status_closure")})
              p2 = {k: v for k, v in p.items() if k not in ("cnjs", "n_cnjs", "longas")}
              p2["tamanhos_numeros"] = [len(x) for x in p["longas"]]
              p2["processos"] = achados
              saida.append(p2)
          json.dump({"dias": dias, "pagador": pagador, "pagamentos": saida, "chaves_lawsuit": sorted(lw[0].keys()) if lw else []},
                    open("caixa_processos.json", "w"), ensure_ascii=False, indent=1)
          PY
      - name: Commit resultado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f caixa_processos.json
          git diff --cached --quiet || git commit -m "Rastreio dos repasses da Caixa: processo no Asaas para o Advbox"
          git pull --rebase origin main || true
          git push || echo "Push falhou"
