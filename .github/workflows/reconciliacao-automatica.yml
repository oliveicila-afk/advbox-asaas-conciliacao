name: Reconciliação Automática — Asaas vs Advbox

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Data para conciliar (AAAA-MM-DD). Ex: 2026-09-01"
        required: true
      dry_run:
        description: "true = simular (sem gravar). false = executar correções reais"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  reconciliar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Força buscar todo histórico para evitar cache

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests fpdf2

      - name: Verificar variáveis de ambiente
        run: |
          echo "TARGET_DATE: ${{ github.event.inputs.target_date }}"
          echo "DRY_RUN: ${{ github.event.inputs.dry_run }}"
          echo "TIMEZONE: America/Manaus"
          echo "ASAAS_TOKEN: $(if [ -z '${{ secrets.ASAAS_TOKEN }}' ]; then echo 'NÃO CONFIGURADO'; else echo '✓ Configurado'; fi)"
          echo "ADVBOX_TOKEN: $(if [ -z '${{ secrets.ADVBOX_TOKEN }}' ]; then echo 'NÃO CONFIGURADO'; else echo '✓ Configurado'; fi)"

      - name: Rodar conciliação com correções automáticas
        env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TIMEZONE: America/Manaus
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python3 analise_dia_a_dia.py

      - name: Upload relatório e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-conciliacao
          path: |
            relatorio_*.json
          retention-days: 30

      - name: Commit relatório ao repositório
        if: always()
        run: |
          if ls relatorio_*.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f relatorio_*.json
            git commit -m "Relatório da reconciliação (${{ github.event.inputs.target_date }})" || exit 0
            git pull --rebase origin main || true
            git push
          fi
