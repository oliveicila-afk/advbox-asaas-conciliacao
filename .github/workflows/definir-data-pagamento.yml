name: Definir data de pagamento (id:data ; data vazia = desmarcar como pago)
on:
  workflow_dispatch:
    inputs:
      itens: {description: "id:YYYY-MM-DD separados por virgula; 'id:' desmarca o pagamento", required: true}
permissions:
  contents: write
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          ITENS: ${{ github.event.inputs.itens }}
        run: |
          python3 - <<'PY'
          import os, json, time, requests
          hb={"Authorization":f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}","User-Agent":"Mozilla/5.0","Accept":"application/json"}
          B="https://app.advbox.com.br/api/v1"; out=[]
          for it in os.environ["ITENS"].split(","):
              tid,_,data=it.strip().partition(":")
              d=requests.get(f"{B}/transactions/{tid}",headers=hb,timeout=60).json(); time.sleep(2.2); d=d.get("data",d)
              p={"entry_type":d.get("entry_type") or "income","users_id":d.get("users_id") or 65747,"debit_account":193264,
                 "categories_id":d.get("categories_id"),"cost_centers_id":d.get("cost_centers_id"),"customers_id":d.get("customers_id"),
                 "lawsuits_id":d.get("lawsuits_id"),"amount":f"{float(d['amount']):.2f}".replace(".",","),
                 "date_due":str(d.get("date_due"))[:10],"date_payment":data.strip(),"description":d.get("description") or ""}
              p={k:v for k,v in p.items() if v is not None}
              r=requests.put(f"{B}/transactions/{tid}",headers={**hb,"Content-Type":"application/json"},json=p,timeout=60); time.sleep(2.2)
              chk=requests.get(f"{B}/transactions/{tid}",headers=hb,timeout=60).json(); time.sleep(2.2); chk=chk.get("data",chk)
              out.append({"id":tid,"http":r.status_code,"date_payment_depois":str(chk.get("date_payment") or "")[:10]})
          json.dump(out,open("definir_data_pagamento.json","w"),indent=1); print(out)
          PY
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add definir_data_pagamento.json; git commit -qm "definir data pagamento" || true; git pull -q --rebase; git push -q
