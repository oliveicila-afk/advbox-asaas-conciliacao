name: Lançar receitas de uma lista (categoria/centro/cliente/processo informados)
on:
  workflow_dispatch:
    inputs:
      itens: {description: "JSON: lista de {dia,valor,lawsuit,customer,categoria,centro,desc}", required: true}
permissions:
  contents: write
jobs:
  l:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          ITENS: ${{ github.event.inputs.itens }}
        run: |
          python3 - <<'PY'
          import os, json, time, requests
          hb={"Authorization":f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}","User-Agent":"Mozilla/5.0","Accept":"application/json","Content-Type":"application/json"}
          B="https://app.advbox.com.br/api/v1"
          itens=json.loads(os.environ["ITENS"])
          st=requests.get(f"{B}/settings",headers=hb,timeout=60).json(); time.sleep(2.2)
          cat={c["category"]:c["id"] for c in st["financial"]["categories"]}
          cc={c["cost_center"]:c["id"] for c in st["financial"]["cost_centers"]}
          res=[]
          for it in itens:
              c=cat.get(it["categoria"]); k=cc.get(it["centro"])
              if not c or not k:
                  res.append({"valor":it["valor"],"criado":False,"motivo":"categoria ou centro inexistente","categoria_ok":bool(c),"centro_ok":bool(k)}); continue
              p={"users_id":65747,"entry_type":"income","debit_account":193264,"categories_id":c,"cost_centers_id":k,
                 "amount":f"{float(it['valor']):.2f}".replace(".",","),"date_due":it["dia"],"date_payment":it["dia"],"description":it.get("desc","Repasse (êxito)")}
              if it.get("customer"): p["customers_id"]=it["customer"]
              if it.get("lawsuit"): p["lawsuits_id"]=it["lawsuit"]
              r=requests.post(f"{B}/transactions",headers=hb,json=p,timeout=30); time.sleep(2.2)
              res.append({"valor":it["valor"],"criado":r.status_code in (200,201),"http":r.status_code,"resp":r.text[:160]})
          json.dump(res,open("lancar_lista_resultado.json","w"),ensure_ascii=False,indent=1); print(res)
          PY
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f lancar_lista_resultado.json; git commit -m "lancar lista" || true
          git pull --rebase origin main || true; git push || true
