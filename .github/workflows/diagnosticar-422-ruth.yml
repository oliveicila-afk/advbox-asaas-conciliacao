name: Diagnosticar erro 422 dos lancamentos de 679,66 (sem nomes)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, time, requests
          hb={"Authorization":f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}","User-Agent":"Mozilla/5.0","Accept":"application/json"}
          B="https://app.advbox.com.br/api/v1"; out=[]
          f=requests.get(f"{B}/settings",headers=hb,timeout=60).json().get("financial",{}); time.sleep(2.2)
          cats={c["id"]:c["category"] for c in f["categories"]}; ccs={c["id"]:c["cost_center"] for c in f["cost_centers"]}
          for tid in (11932606,11932607,11932608,11932610):
              d=requests.get(f"{B}/transactions/{tid}",headers=hb,timeout=60).json(); time.sleep(2.2); d=d.get("data",d)
              p={"entry_type":d.get("entry_type") or "income","users_id":d.get("users_id") or 65747,"debit_account":193264,
                 "categories_id":d.get("categories_id"),"cost_centers_id":d.get("cost_centers_id"),"customers_id":d.get("customers_id"),
                 "lawsuits_id":d.get("lawsuits_id"),"amount":f"{float(d['amount']):.2f}".replace(".",","),
                 "date_due":str(d.get("date_due"))[:10],"description":d.get("description") or ""}
              if d.get("date_payment"): p["date_payment"]=str(d["date_payment"])[:10]
              p={k:v for k,v in p.items() if v is not None}
              r=requests.put(f"{B}/transactions/{tid}",headers={**hb,"Content-Type":"application/json"},json=p,timeout=60); time.sleep(2.2)
              out.append({"id":tid,"http":r.status_code,"resp":r.text[:400],"categories_id":d.get("categories_id"),"cat_existe":d.get("categories_id") in cats,
                          "cat_nome":cats.get(d.get("categories_id")),"cc_id":d.get("cost_centers_id"),"cc_existe":d.get("cost_centers_id") in ccs,"cc_nome":ccs.get(d.get("cost_centers_id")),
                          "tem_cliente":bool(d.get("customers_id")),"tem_processo":bool(d.get("lawsuits_id")),"due":str(d.get("date_due"))[:10],"pago":str(d.get("date_payment") or "")[:10],"users_id":d.get("users_id"),
                          "chaves_detalhe":sorted(d.keys())})
          json.dump(out,open("diag_422_ruth.json","w"),ensure_ascii=False,indent=1); print(out)
          PY
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add diag_422_ruth.json; git commit -qm "diag 422" || true; git pull -q --rebase; git push -q
