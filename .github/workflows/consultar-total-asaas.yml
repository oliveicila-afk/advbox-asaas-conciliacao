name: Consultar Total Asaas - Sep 01-10

on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Consultar Total Asaas (01-10 Set)
        env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
        run: |
          python3 << 'PYTHON_EOF'
          import os
          import sys
          import requests

          ASAAS_TOKEN = os.environ.get("ASAAS_TOKEN", "").strip()
          ASAAS_BASE = "https://api.asaas.com/v3"

          if not ASAAS_TOKEN:
              print("❌ ASAAS_TOKEN não definido")
              sys.exit(1)

          # Usar access_token como parâmetro na URL (método do Asaas)
          params = {
              "access_token": ASAAS_TOKEN,
              "startDate": "2026-09-01",
              "finishDate": "2026-09-10",
              "limit": 100
          }

          print("=" * 80)
          print("TOTAL EM ASAAS: 1 a 10 de Setembro de 2026")
          print("=" * 80)

          try:
              # Usar /financialTransactions que retorna receitas
              resp = requests.get(f"{ASAAS_BASE}/financialTransactions", params=params, timeout=30)
              print(f"\nStatus: {resp.status_code}")
              
              if resp.status_code == 200:
                  data = resp.json()
                  transactions = data.get("data", [])
                  
                  print(f"\nTotal de Transações: {len(transactions)}")
                  
                  # Filtrar apenas receitas (PAYMENT_RECEIVED, RECEIVABLE_ANTICIPATION)
                  receitas = [t for t in transactions if t.get("type") in ("PAYMENT_RECEIVED", "RECEIVABLE_ANTICIPATION_GROSS_CREDIT")]
                  print(f"Receitas: {len(receitas)}")
                  
                  total = 0
                  for r in receitas:
                      value = float(r.get("value", 0))
                      date = r.get("date", "")
                      tx_type = r.get("type", "")
                      ext_ref = r.get("externalReference", "")
                      
                      print(f"\n  Data: {date}")
                      print(f"  Tipo: {tx_type}")
                      print(f"  Valor: R$ {value:,.2f}")
                      print(f"  Ref: {ext_ref}")
                      
                      total += value
                  
                  print("\n" + "=" * 80)
                  print(f"TOTAL DE RECEITAS (Sep 01-10): R$ {total:,.2f}")
                  print("=" * 80)
              else:
                  print(f"\nErro na requisição:")
                  print(resp.text[:500])
                  sys.exit(1)
                  
          except Exception as e:
              print(f"❌ Erro: {e}")
              import traceback
              traceback.print_exc()
              sys.exit(1)

          PYTHON_EOF
