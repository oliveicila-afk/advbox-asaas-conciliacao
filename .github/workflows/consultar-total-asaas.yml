name: Consultar Total Asaas - Sep 01-10

on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests -q

      - name: Consultar Total Asaas
        env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
        run: |
          mkdir -p output
          python3 << 'PYTHON_EOF' | tee output/resultado_asaas.txt
          import os
          import json
          import requests

          ASAAS_TOKEN = os.environ.get("ASAAS_TOKEN", "").strip()
          ASAAS_BASE = "https://api.asaas.com/v3"

          print("=" * 80)
          print("TOTAL EM ASAAS: 1 a 10 de Setembro de 2026")
          print("=" * 80)

          if not ASAAS_TOKEN:
              print("❌ Token não encontrado")
              exit(1)

          print(f"✓ Token recebido: {len(ASAAS_TOKEN)} caracteres")

          try:
              # Asaas API expects access_token in headers, not query parameters
              headers = {
                  "access_token": ASAAS_TOKEN
              }
              params = {
                  "startDate": "2026-09-01",
                  "finishDate": "2026-09-10",
                  "limit": 100
              }

              r = requests.get(
                  f"{ASAAS_BASE}/financialTransactions",
                  headers=headers,
                  params=params,
                  timeout=30
              )
              print(f"\nStatus: {r.status_code}")
              
              if r.status_code == 200:
                  data = r.json()
                  transactions = data.get("data", [])
                  
                  print(f"\nTotal de Transações no Asaas: {len(transactions)}")
                  
                  receitas = [t for t in transactions if t.get("type") in ("PAYMENT_RECEIVED", "RECEIVABLE_ANTICIPATION_GROSS_CREDIT")]
                  print(f"Receitas (filtradas): {len(receitas)}")
                  
                  print("\n" + "-" * 80)
                  print("DETALHAMENTO:")
                  print("-" * 80)
                  
                  total = 0
                  for i, t in enumerate(receitas, 1):
                      value = float(t.get("value", 0))
                      date = t.get("date", "")
                      tx_type = t.get("type", "")
                      
                      print(f"\n{i}. Data: {date}")
                      print(f"   Tipo: {tx_type}")
                      print(f"   Valor: R$ {value:,.2f}")
                      
                      total += value
                  
                  print("\n" + "=" * 80)
                  print(f"✅ TOTAL NO ASAAS (Sep 01-10): R$ {total:,.2f}")
                  print("=" * 80)
              else:
                  print(f"❌ Erro {r.status_code}")
                  print(r.text[:500])
                  exit(1)
                  
          except Exception as e:
              print(f"❌ Erro: {e}")
              import traceback
              traceback.print_exc()
              exit(1)

          PYTHON_EOF

      - name: Upload resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-asaas
          path: output/
          retention-days: 7
