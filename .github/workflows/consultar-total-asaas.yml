name: Consultar Total Asaas - Sep 01-10

on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests -q

      - name: Consultar Total Asaas (01-10 Set)
        env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
        run: python3 diagnostico_asaas.py || echo "Script diagnostico falhou, tentando alternativa..."

      - name: Consultar via script alternativo
        env:
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
        if: always()
        run: |
          python3 << 'PYTHON_EOF'
          import os
          import json
          import requests

          ASAAS_TOKEN = os.environ.get("ASAAS_TOKEN", "").strip()
          ASAAS_BASE = "https://api.asaas.com/v3"

          print("\n" + "=" * 80)
          print("CONSULTA DIRETA: Total Asaas (Sep 01-10)")
          print("=" * 80)

          if not ASAAS_TOKEN:
              print("❌ Token não encontrado")
              exit(1)

          print(f"✓ Token recebido: {len(ASAAS_TOKEN)} caracteres")

          # Tentar método 1: access_token como parâmetro
          print("\n[Método 1] Usando access_token como parâmetro...")
          try:
              r = requests.get(
                  f"{ASAAS_BASE}/financialTransactions",
                  params={
                      "access_token": ASAAS_TOKEN,
                      "startDate": "2026-09-01",
                      "finishDate": "2026-09-10",
                      "limit": 100
                  },
                  timeout=30
              )
              print(f"Status: {r.status_code}")
              if r.status_code == 200:
                  data = r.json()
                  transactions = data.get("data", [])
                  receitas = [t for t in transactions if t.get("type") in ("PAYMENT_RECEIVED", "RECEIVABLE_ANTICIPATION_GROSS_CREDIT")]
                  total = sum(float(t.get("value", 0)) for t in receitas)
                  
                  print(f"\n✅ Transações encontradas: {len(transactions)}")
                  print(f"Receitas: {len(receitas)}")
                  print(f"\n📊 TOTAL: R$ {total:,.2f}")
              else:
                  print(f"❌ Erro {r.status_code}")
                  print(r.text[:200])
          except Exception as e:
              print(f"❌ Falha: {e}")

          PYTHON_EOF
