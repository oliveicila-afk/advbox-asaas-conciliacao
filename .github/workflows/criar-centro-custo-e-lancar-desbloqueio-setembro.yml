name: Criar centro de custo e lançar desbloqueio setembro

on:
  workflow_dispatch:

jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
          ASAAS_TOKEN: ${{ secrets.ASAAS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, requests, time

          advbox_token = os.environ["ADVBOX_TOKEN"].strip()
          asaas_token  = os.environ["ASAAS_TOKEN"].strip()

          ha = {"access_token": asaas_token, "Accept": "application/json"}
          hb = {
              "Authorization": f"Bearer {advbox_token}",
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "Mozilla/5.0"
          }
          base = "https://app.advbox.com.br/api/v1"
          NOME_CENTRO    = "ASAAS — SEM IDENTIFICAÇÃO"
          NOME_CATEGORIA = "DESBLOQUEIO DE SALDO ASAAS"

          # ── 1. Carregar settings ────────────────────────────────────────────
          r = requests.get(f"{base}/settings", headers=hb, timeout=30)
          if r.status_code != 200:
              print(f"ERRO ao buscar settings: {r.status_code} - {r.text[:300]}")
              exit(1)
          financial = r.json().get("financial", {})
          raw_cats = financial.get("categories", [])
          # Filtrar apenas categorias de receita (entry_type == "income")
          income_raw = [c for c in raw_cats if c.get("entry_type") == "income"]
          categorias = {c["category"]: c["id"] for c in income_raw}
          centros    = {c["cost_center"]: c["id"] for c in financial.get("cost_centers", [])}

          # ── 2. Centro de custo: preferir o específico, fallback para OUTRAS RECEITAS-GERAL ──
          FALLBACK_CENTRO = "OUTRAS RECEITAS-GERAL"
          if NOME_CENTRO in centros:
              cc_id = centros[NOME_CENTRO]
              print(f"✅ Centro de custo '{NOME_CENTRO}' encontrado (id={cc_id})")
          elif FALLBACK_CENTRO in centros:
              cc_id = centros[FALLBACK_CENTRO]
              print(f"⚠️  Centro '{NOME_CENTRO}' não existe; usando fallback '{FALLBACK_CENTRO}' (id={cc_id})")
          else:
              # Usar qualquer centro disponível
              primeiro = next(iter(centros.items()), None)
              if primeiro:
                  cc_id = primeiro[1]
                  print(f"⚠️  Usando centro de custo '{primeiro[0]}' como fallback (id={cc_id})")
              else:
                  cc_id = None
                  print(f"⚠️  Nenhum centro de custo disponível — lançando sem centro de custo")

          # ── 3. Verificar categoria (fallback para categoria de receita existente) ─
          FALLBACK_CATS = [
              "HONORÁRIOS CONTRATUAIS",
              "RECEITAS FINANCEIRAS-GERAL",
              "RECEITAS NÃO IDENTIFICADAS",
              "OUTRAS RECEITAS",
              "HONORÁRIOS CONSULTORIAS",
          ]

          print(f"\n=== Categorias de receita (income) disponíveis: {len(categorias)} ===")
          for n in sorted(categorias):
              print(f"  {n} (id={categorias[n]})")

          if NOME_CATEGORIA in categorias:
              cat_id = categorias[NOME_CATEGORIA]
              print(f"\n✅ Categoria '{NOME_CATEGORIA}' encontrada (id={cat_id})")
          else:
              cat_id = None
              for fb in FALLBACK_CATS:
                  if fb in categorias:
                      cat_id = categorias[fb]
                      print(f"\n⚠️  Categoria '{NOME_CATEGORIA}' não existe; usando fallback '{fb}' (id={cat_id})")
                      break
              if cat_id is None:
                  # Usar qualquer categoria de income disponível
                  primeiro = next(iter(categorias.items()), None)
                  if primeiro:
                      cat_id = primeiro[1]
                      print(f"\n⚠️  Usando categoria '{primeiro[0]}' como fallback (id={cat_id})")
                  else:
                      print(f"\n❌ Nenhuma categoria disponível — impossível lançar")
                      exit(1)

          # ── 4. Buscar DEBIT_REVERSAL em setembro 2026 no ASAAS ─────────────
          print("\n🔍 Buscando DEBIT_REVERSAL em setembro 2026 no ASAAS...")
          all_sep = []
          for dia in range(1, 31):
              d = f"2026-09-{dia:02d}"
              off = 0
              while True:
                  r3 = requests.get("https://api.asaas.com/v3/financialTransactions",
                                    headers=ha,
                                    params={"startDate": d, "finishDate": d, "limit": 100, "offset": off},
                                    timeout=30)
                  batch = r3.json().get("data", [])
                  all_sep.extend(batch)
                  if not r3.json().get("hasMore") or not batch:
                      break
                  off += 100

          debit_reversals = [t for t in all_sep if t.get("type") == "DEBIT_REVERSAL"]
          print(f"Encontrados: {len(debit_reversals)} DEBIT_REVERSAL(s)")

          if not debit_reversals:
              print("Nenhum DEBIT_REVERSAL em setembro — nada a lançar.")
          else:
              # ── 5. Lançar cada um no Advbox (sem cliente, sem processo) ────
              for t in debit_reversals:
                  valor = float(t.get("value", 0))
                  data  = str(t.get("date", ""))[:10]
                  tid   = t.get("id", "")
                  payload = {
                      "users_id": 65747,
                      "entry_type": "income",
                      "debit_account": 193264,
                      "categories_id": cat_id,
                      "amount": f"{valor:.2f}".replace(".", ","),
                      **({"cost_centers_id": cc_id} if cc_id else {}),
                      "date_due": data,
                      "date_payment": data,
                      "description": f"Desbloqueio de saldo ASAAS — cliente não identificado pelo ASAAS (id: {tid})",
                  }
                  r4 = requests.post(f"{base}/transactions",
                                     headers=hb, json=payload, timeout=30)
                  ok = r4.status_code in (200, 201)
                  print(f"  {'✅' if ok else '❌'} Lançamento R$ {valor:.2f} | data {data} | id ASAAS: {tid}")
                  if not ok:
                      print(f"     Resposta: {r4.status_code} - {r4.text[:300]}")
                  time.sleep(1)

          print("\n✅ Concluído.")
          PY
