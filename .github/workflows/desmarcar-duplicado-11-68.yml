name: Desmarcar 1 dos 2 lançamentos de R$ 11,68 (15/09)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, time, requests
          hb = {"Authorization": f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}", "User-Agent": "Mozilla/5.0", "Accept": "application/json", "Content-Type": "application/json"}
          B="https://app.advbox.com.br/api/v1"; c=[]; off=0
          while True:
              for _ in range(6):
                  r=requests.get(f"{B}/transactions",headers=hb,params={"limit":1000,"offset":off},timeout=90)
                  if r.status_code!=429: break
                  time.sleep(30)
              time.sleep(2.2); b=r.json().get("data",[])
              c+=[t for t in b if t.get("entry_type")=="income" and str(t.get("date_payment") or "")[:10]=="2026-09-15" and round(float(t.get("amount",0)),2)==11.68]
              if len(b)<1000: break
              off+=1000
          out={"achados":[t["id"] for t in c]}
          if len(c)==2:
              alvo=max(t["id"] for t in c)
              u=requests.put(f"{B}/transactions/{alvo}",headers=hb,json={"date_payment":""},timeout=30)
              out.update({"desmarcado":alvo,"http":u.status_code})
          json.dump(out,open("desmarcar_11_68_resultado.json","w")); print(out)
          PY
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f desmarcar_11_68_resultado.json; git commit -m "desmarcar 11,68" || true
          git pull --rebase origin main || true; git push || true
