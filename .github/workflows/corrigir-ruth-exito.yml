name: Corrigir 4 lancamentos de 679,66 (exito Isencao de IR / SERVIDOR PUBLICO-INDICACAO)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          ADVBOX_TOKEN: ${{ secrets.ADVBOX_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, time, unicodedata, requests
          hb={"Authorization":f"Bearer {os.environ['ADVBOX_TOKEN'].strip()}","User-Agent":"Mozilla/5.0","Accept":"application/json"}
          B="https://app.advbox.com.br/api/v1"; out=[]
          sa=lambda t: unicodedata.normalize("NFKD",str(t or "")).encode("ascii","ignore").decode().upper().strip()
          f=requests.get(f"{B}/settings",headers=hb,timeout=60).json().get("financial",{}); time.sleep(2.2)
          cat=[(c["category"],c["id"]) for c in f["categories"] if sa(c["category"])==sa("HONORÁRIOS CONTRATUAIS DE ÊXITO-ISENÇÃO DE IMPOSTO DE RENDA")]
          cc=[(c["cost_center"],c["id"]) for c in f["cost_centers"] if sa(c["cost_center"])==sa("SERVIDOR PUBLICO-INDICAÇÃO")]
          out.append({"cat":cat,"cc":cc})
          if len(cat)==1 and len(cc)==1:
              for tid in (11932606,11932607,11932608,11932610):
                  d=requests.get(f"{B}/transactions/{tid}",headers=hb,timeout=60).json(); time.sleep(2.2); d=d.get("data",d)
                  p={"entry_type":"income","users_id":d.get("users_id") or 65747,"debit_account":193264,
                     "categories_id":cat[0][1],"cost_centers_id":cc[0][1],"customers_id":d.get("customers_id"),"lawsuits_id":d.get("lawsuits_id"),
                     "amount":f"{float(d['amount']):.2f}".replace(".",","),"date_due":str(d.get("date_due"))[:10],"description":d.get("description") or ""}
                  if d.get("date_payment"): p["date_payment"]=str(d["date_payment"])[:10]
                  p={k:v for k,v in p.items() if v is not None}
                  r=requests.put(f"{B}/transactions/{tid}",headers={**hb,"Content-Type":"application/json"},json=p,timeout=60); time.sleep(2.2)
                  chk=requests.get(f"{B}/transactions/{tid}",headers=hb,timeout=60).json(); time.sleep(2.2); chk=chk.get("data",chk)
                  out.append({"id":tid,"http":r.status_code,"resp":r.text[:150] if r.status_code!=200 else "","cat":chk.get("category"),"cc":chk.get("cost_center"),"pago":str(chk.get("date_payment") or "")[:10]})
          json.dump(out,open("corrigir_ruth.json","w"),ensure_ascii=False,indent=1); print(out)
          PY
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add corrigir_ruth.json; git commit -qm "corrigir ruth" || true; git pull -q --rebase; git push -q
