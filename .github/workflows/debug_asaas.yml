name: Debug ASAAS Faturas

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Debug ASAAS
        env:
          ASAAS_CHAVE: ${{ secrets.ASAAS_CHAVE }}
        run: python debug_asaas_faturas.py
